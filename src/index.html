<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathieu Godefroy, product manager</title>
<meta name="description" content="Comprendre les utilisateurs pour leur apporter des solutions qui ont du sens.">
<link rel="preload" href="assets/fonts/GeneralSans-Variable.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ---------------------------------------------------------------------------
   General Sans, coupe variable obligatoire : les paliers 470 et 550
   n'existent pas en statique et retomberaient tous les deux sur 500.
   ------------------------------------------------------------------------ */
@font-face {
  font-family: 'General Sans';
  src: url('assets/fonts/GeneralSans-Variable.woff2') format('woff2-variations'),
       url('assets/fonts/GeneralSans-Variable.woff')  format('woff-variations');
  font-weight: 200 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --color-parchment-canvas: #fffaeb;
  --color-papier: #fffdf6;
  --color-suie: #171613;
  /* Le noir habitable du système, un cran au-dessus de Suie. C'est la
     matière de la carte projet, la seule surface sombre du site. */
  --color-surface: #201e1a;
  --color-jade: #0b6b5a;
  --color-ember: #fa520f;
  --color-ember-ink: #c04408;
  --color-soft-butter: #fff0c2;

  /* muted mesure 4.9:1 sur le parchemin, au dessus du plancher 4.5:1 */
  --color-muted: rgba(23, 22, 19, 0.62);
  --color-hairline: rgba(23, 22, 19, 0.12);
  --color-border: rgba(23, 22, 19, 0.13);
  --color-wash: rgba(23, 22, 19, 0.06);

  --font-general: 'General Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --weight-title: 600;
  --weight-lede: 550;
  --weight-body: 470;

  --page-max-width: 1200px;
  --gutter: 48px;

  --shadow-xl:
    rgba(127, 99, 21, 0.12) -8px 16px 39px 0px,
    rgba(127, 99, 21, 0.1) -33px 64px 72px 0px,
    rgba(127, 99, 21, 0.06) -73px 144px 97px 0px,
    rgba(127, 99, 21, 0.02) -130px 256px 115px 0px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

@media (max-width: 720px) { :root { --gutter: 20px; } }

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--color-parchment-canvas);
  color: var(--color-suie);
  font-family: var(--font-general);
  font-weight: var(--weight-body);
  font-size: 17px;
  line-height: 1.68;
  letter-spacing: -0.008em;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--color-ember);
  outline-offset: 3px;
  border-radius: 3px;
}

.wrap {
  width: 100%;
  max-width: var(--page-max-width);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ===========================================================================
   HEADER, composant global, present sur toutes les sections.

   Contraste des graisses : le nom est le seul 550 du header, les liens
   descendent en 470. Un seul 600 dans tout le premier ecran, le manifeste.
   ======================================================================== */
.site-header {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 100;
  background: var(--color-parchment-canvas);
  transform: translateY(0);
  transition: transform 220ms var(--ease-out);
}
.site-header[data-hidden] { transform: translateY(-100%); }

.site-header__inner {
  display: flex;
  align-items: center;
  gap: 24px;
  height: 72px;
}

.site-name {
  font-size: 17px;
  font-weight: var(--weight-lede);
  letter-spacing: -0.014em;
  white-space: nowrap;      /* le nom garde la priorite, jamais comprime */
  margin-right: auto;
}

/* Une seule rangee de cibles de 32px. Le retrait negatif ramene le dernier
   glyphe sur la marge de page : c'est l'icone qui s'aligne avec le nom,
   pas sa boite de survol. */
.header-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
  margin-right: -7px;
}

.link-github {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 32px;
  padding: 0 7px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: var(--weight-body);
  letter-spacing: -0.006em;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 150ms ease;
}
.link-github__word {
  text-decoration: 1.5px solid underline transparent;
  text-underline-offset: 4px;
  transition: text-decoration-color 150ms ease;
}
.link-github:hover .link-github__word,
.link-github:focus-visible .link-github__word {
  text-decoration-color: var(--color-ember);
}

.pill-icon {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 150ms ease;
}
.pill-icon:hover,
.link-github:hover { background: var(--color-wash); }
.pill-icon:active { background: rgba(23, 22, 19, 0.1); }
.pill-icon[data-toast-open] { background: var(--color-wash); }

/* Chaque viewBox est recadre sur l'encre du glyphe, donc la boite SVG est
   exactement le dessin. Centrer les boites aligne les encres, hauts comme
   bas, ce qu'un viewBox geometrique ne faisait pas : la masse du sigle
   LinkedIn tombe sous son centre geometrique et le faisait pendre. */
.icon { display: block; overflow: visible; }
/* Tailles calculees a partir des bornes d'encre mesurees (getBBox), pour que
   les trois encres fassent 13px de haut et partagent la meme ligne de pied.
   GitHub monte a 14px : un disque plein lit plus petit qu'un trace a hauteur
   egale. Le trace du mail est etendu de 0.85 par sa demi epaisseur de trait,
   d'ou la marge du viewBox, sans quoi le bord droit se faisait rogner. */
.icon--github   { width: 14.35px; height: 14px; }
.icon--mail     { width: 17.1px;  height: 13.35px; }
.icon--linkedin { width: 14.89px; height: 13px; }

/* Sur mobile, GitHub repasse en pastille de meme gabarit */
@media (max-width: 720px) {
  .link-github { width: 32px; padding: 0; }
  .link-github__word { display: none; }
  .site-header__inner { height: 64px; }
}

/* ---- Pastille de copie ------------------------------------------------- */
.mail-wrap { position: relative; }

.toast {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 10;
  width: max-content;
  max-width: min(340px, calc(100vw - 2 * var(--gutter)));
  padding: 8px 10px 8px 12px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: var(--color-papier);
  box-shadow: var(--shadow-xl);

  /* Entree et sortie par le meme chemin, en transition et non en keyframes :
     un second clic retargette depuis la valeur courante au lieu de repartir
     de zero. L'origine est posee sur la gachette. */
  transform-origin: top right;
  opacity: 0;
  transform: translateY(-5px) scale(0.97);
  transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
  pointer-events: none;
}
.toast[data-open] {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.toast__row {
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}

/* L'etat de copie suit l'idiome du systeme : une pastille de 7px puis le
   mot, dans la meme teinte. Ni puce coloree, ni badge. */
.toast__state {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: var(--weight-lede);
  line-height: 1.3;
  letter-spacing: -0.006em;
}
.toast__state::before {
  content: '';
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 999px;
  background: currentColor;
}
.toast__state--ok   { color: var(--color-jade); }
.toast__state--fail { color: var(--color-ember-ink); }
.toast__state--fail::before { background: var(--color-ember); }

.toast__sep { width: 1px; height: 16px; flex: none; background: var(--color-hairline); }

/* L'adresse est toujours affichee, en haut et selectionnable a la main.
   Que la copie ait reussi ou non, le contact n'est jamais perdu, et la
   pastille ne change pas de forme entre les deux etats : seul l'etat, en
   dessous, change de mot et de teinte. */
.toast__addr {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: var(--weight-lede);
  line-height: 1.4;
  letter-spacing: -0.006em;
  color: var(--color-suie);
  user-select: all;
  -webkit-user-select: all;
}

/* Bouton fantome : pas de pave noir dans une pastille de 36px de haut */
.toast__cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
  padding: 4px 6px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: var(--weight-lede);
  letter-spacing: -0.006em;
  text-decoration: none;
  transition: background-color 150ms ease;
}
.toast__cta:hover { background: var(--color-wash); }
.toast__cta svg { color: var(--color-ember); }

/* ===========================================================================
   ACCUEIL
   ======================================================================== */
.hero {
  position: relative;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}
/* Sous 600px de hauteur utile, hauteur automatique plutot qu'un manifeste
   ecrase. L'ancre peut alors sortir du premier ecran. */
@media (max-height: 600px) {
  .hero { min-height: auto; padding-block: 112px 64px; }
}

.hero__body {
  flex: 1;
  display: flex;
  align-items: center;
}

/* Label et manifeste forment une seule boite en max-content, centree sur la
   page, le label cale sur le centre vertical du manifeste. */
.duo {
  display: flex;
  align-items: center;
  gap: 96px;
  width: max-content;
  max-width: 100%;
  margin-inline: auto;
}

.manifeste {
  margin: 0;
  /* Coupes ecrites en dur : le texte etant fige, l'absence de mot orphelin
     est deterministe au lieu d'etre confiee au navigateur. Et max-content
     fait coller la boite a l'encre, sans quoi centrer la boite ne centre
     pas ce que l'oeil voit. */
  width: max-content;
  max-width: 100%;
  font-size: 34px;
  line-height: 1.26;
  letter-spacing: -0.03em;
  font-weight: var(--weight-title);   /* le seul 600 du premier ecran */
}
.manifeste__cursor {
  display: inline-block;
  width: 0.08em;
  height: 0.92em;
  margin-left: 0.12em;
  vertical-align: -0.08em;
  background: var(--color-ember);     /* Ember en aplat, jamais en texte */
  /* Purement decoratif : ni clignotement, ni animation de saisie. */
}
.vignette {
  display: inline-block;
  vertical-align: -0.2em;
  margin-left: 0.24em;
  width: 1.05em;
  height: 1.05em;
  border-radius: 999px;
}

.label-metier {
  margin: 0;
  color: var(--color-muted);
  font-size: 17px;
  line-height: 1.4;
  font-weight: var(--weight-body);
  white-space: nowrap;
}

/* ---- Ancre Projets ---------------------------------------------------- */
.anchor-slot {
  padding-bottom: 56px;
  transition: opacity 200ms var(--ease-out);
}
.anchor-slot__wrap { display: flex; justify-content: center; }
.anchor-slot[data-gone] { opacity: 0; pointer-events: none; }

.anchor {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
  font-size: 17px;
  font-weight: var(--weight-lede);
  letter-spacing: -0.014em;
  text-decoration: none;
}
.anchor__word {
  text-decoration: 1.5px solid underline transparent;
  text-underline-offset: 5px;
  transition: text-decoration-color 150ms ease;
}
.anchor:hover .anchor__word,
.anchor:focus-visible .anchor__word { text-decoration-color: var(--color-ember); }
.anchor__arrow {
  display: block;
  color: var(--color-ember);
  transition: transform 160ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  .anchor:hover .anchor__arrow { transform: translateY(3px); }
}
.anchor:focus-visible .anchor__arrow { transform: translateY(3px); }

/* ---- Apparition au chargement -----------------------------------------
   Une animation CSS, pas une transition pilotee en JS : elle tourne hors du
   thread principal pendant que la page charge, et elle joue meme si le
   JavaScript est desactive. Sans elle, un .rise a opacity 0 laisserait un
   ecran vide.
   ---------------------------------------------------------------------- */
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.rise { animation: rise 520ms var(--ease-out) both; }
.rise--2 { animation-delay: 70ms; }
.rise--3 { animation-delay: 140ms; }

/* ===========================================================================
   MOBILE, empilement, ordre label puis manifeste puis ancre
   ======================================================================== */
@media (max-width: 720px) {
  .duo { display: block; width: auto; margin-inline: 0; }

  .label-metier {
    display: inline-flex;
    align-items: center;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.2;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: var(--weight-lede);
  }

  /* "Comprendre les utilisateurs" mesure 13.9 fois le corps dans cette
     coupe. Le plafond calcule garantit que la plus longue des trois lignes
     tient dans la largeur utile, sans jamais couper un mot. */
  .manifeste {
    width: auto;
    font-size: min(28px, calc((100vw - 40px) / 13.9));
    line-height: 1.24;
  }

  .anchor-slot { padding-bottom: 40px; }
  .anchor-slot__wrap { justify-content: flex-start; }
  /* Le retrait annule le rembourrage du lien : c'est l'encre de "Projets"
     qui s'aligne sur la gouttiere, comme le nom et le manifeste. */
  .anchor { margin-left: -4px; }
}

/* ===========================================================================
   PROJETS

   Un seul projet net à la fois, les autres flous. Le raisonnement de chaque
   valeur est dans le prototype d'origine, prototypes/projets/index.html.

   La section n'a pas de défilement à elle : c'est la page qui défile, et la
   loi du flou se calcule à partir de window.scrollY. Un défileur imbriqué
   piégeait la molette dans la liste, et il fallait viser le halo pour en
   sortir.

   Ce qui tient l'écran ensemble, maintenant que rien n'est enfermé :

   1. Le calage sur les projets passe par le snap du document, en proximity.
      Mandatory est exclu : les seuls points de calage de la page sont les
      lignes de projet, et un snap strict interdirait de s'arrêter ailleurs,
      donc de lire l'accueil ou le parcours.
   2. La ligne de focus descend de la hauteur du bandeau fixe, qui n'existait
      pas dans le prototype. Sans cela le bandeau, opaque, mangeait le fondu
      du haut et coupait net le projet précédent au lieu de le laisser
      s'effacer.
   3. Le titre de section, US4 de specs/02-projets.md, occupe exactement la
      bande que la ligne de focus laisse libre. Il est dans le flux, donc il
      s'efface de lui-même au premier défilement, sans une ligne de script.
   4. Le fondu du haut et le halo du bas sont fixes dans la fenêtre, et ne
      s'affichent que pendant l'écran Projets : le premier est un voile de
      parchemin, le second annonce l'Ember de Parcours, aucun des deux n'a de
      sens ailleurs.
   ======================================================================== */

.projets {
  /* La ligne de focus est écrite en dur, et non en calc() : le script la lit
     en parseFloat sur la propriété personnalisée, et une custom property
     n'est pas résolue à la lecture. 196 = 72 de bandeau + les 124 du
     prototype. Même chose pour la version mobile, 164 = 64 + 100. */
  --focus-top: 196px;
  --fade-top: 96px;
  --halo-h: 140px;
  --header-h: 72px;

  /* Le flou est une distance : il se mesure à la taille de l'écran. */
  --blur-scale: 1;

  /* La hauteur de ligne se déduit de la hauteur d'écran : un projet net plus
     la moitié du suivant tiennent entre la ligne de focus et le haut du halo,
     86px de respiration déduits. Une hauteur figée donnerait un écran juste
     sur un portable et creux sur un grand écran. */
  --row-h: clamp(
    240px,
    calc((100svh - var(--focus-top) - var(--halo-h) - 86px) / 1.5),
    520px
  );

  position: relative;
  /* La bande entre le bandeau et la ligne de focus. Elle ne porte plus rien :
     le titre de section, demandé par US4 de specs/02-projets.md, a été
     retiré. Ce que le visiteur voit en arrivant, c'est un projet, pas une
     étiquette qui le nomme. La bande reste, car c'est elle qui pose le
     premier projet sur sa ligne de focus. */
  padding-top: var(--focus-top);
  /* Ce que le dernier projet laisse derrière lui. Calé sur la ligne de focus,
     son bas tombe à focus-top + row-h ; le complément amène le bas de la
     section exactement au bas de la fenêtre, donc Parcours commence hors
     champ et n'apparaît jamais sous un projet encore net. */
  padding-bottom: calc(100svh - var(--focus-top) - var(--row-h));
  border-top: 1px solid var(--color-hairline);
}

/* ---- Chrome de l'écran, fondu du haut et halo du bas --------------------
   Les deux sont fixes dans la fenêtre et n'appartiennent qu'à Projets. Ils
   arrivent quand l'accueil a entièrement quitté l'écran, exactement comme
   quand on clique l'ancre du hero, et repartent dès que Parcours entre :
   un voile de parchemin et une rampe Ember posés sur l'orange plein de
   Parcours ne seraient plus que des salissures.
   ---------------------------------------------------------------------- */
.projets__fade,
.outro {
  opacity: 0;
  visibility: hidden;
  transition: opacity 260ms var(--ease-out), visibility 0s linear 260ms;
}
.projets[data-chrome] .projets__fade,
.projets[data-chrome] .outro {
  opacity: 1;
  visibility: visible;
  transition: opacity 260ms var(--ease-out), visibility 0s;
}

/* Le fondu du haut. Un voile de parchemin posé par-dessus, pas un mask-image
   sur la page : les lignes portent déjà cinq filtres de flou, leur ajouter un
   masque forcerait une couche de composition de plus pour un résultat
   identique sur un fond plat. Il commence sous le bandeau, dont il reprend
   exactement la couleur : la jonction des deux est invisible.

   La rampe compte autant que la hauteur. En trois arrêts, elle tombait de
   0,90 à 0 en vingt-neuf pixels : sur du parchemin cela ne se voyait pas,
   mais posée sur un visuel saturé la marche devenait une bande plus claire à
   bord franc en travers de l'image. Huit arrêts et une longue traîne, et il
   n'y a plus de bord à voir. La hauteur passe de 52 à 96px pour la même
   raison : le voile doit avoir la place de s'éteindre. Il finit bien
   au-dessus de la ligne de focus, le projet net n'est jamais lavé.

   Le voile part du haut de la fenêtre, pas du bas du bandeau, et reste opaque
   sur toute la hauteur de celui-ci. Le bandeau se masque au défilement vers
   le bas : un voile qui commençait sous lui laissait alors les projets se
   faire trancher net par le bord de la fenêtre. Quand le bandeau est là, il
   couvre la partie opaque et rien ne change. Les arrêts sont écrits en
   longueurs et non en pourcentages, pour que la rampe tombe au même endroit
   sur les deux largeurs, où le bandeau et le fondu ne mesurent pas pareil. */
.projets__fade {
  position: fixed;
  inset: 0 0 auto 0;
  height: calc(var(--header-h) + var(--fade-top));
  pointer-events: none;
  z-index: 2;
  background: linear-gradient(to bottom,
    rgb(255, 250, 235) 0,
    rgb(255, 250, 235) var(--header-h),
    rgba(255, 250, 235, 0.98) calc(var(--header-h) + 0.18 * var(--fade-top)),
    rgba(255, 250, 235, 0.92) calc(var(--header-h) + 0.32 * var(--fade-top)),
    rgba(255, 250, 235, 0.80) calc(var(--header-h) + 0.46 * var(--fade-top)),
    rgba(255, 250, 235, 0.60) calc(var(--header-h) + 0.60 * var(--fade-top)),
    rgba(255, 250, 235, 0.36) calc(var(--header-h) + 0.74 * var(--fade-top)),
    rgba(255, 250, 235, 0.14) calc(var(--header-h) + 0.88 * var(--fade-top)),
    rgba(255, 250, 235, 0) 100%);
}

/* ===========================================================================
   LA LIGNE
   Le flou et l'opacité de .row__inner sont écrits par le script, voir LA LOI
   DU FLOU dans le script.
   ======================================================================== */
/* Le calage sur un projet n'est pas confié au snap CSS. Il a été essayé, et
   il n'y a pas de réglage qui tienne : les seuls points de calage de la page
   sont les cinq projets, donc en mandatory la page ne peut plus s'arrêter
   dans l'accueil ni dans le parcours, et en proximity le navigateur rattrape
   depuis deux cents pixels, ce qui retenait la page au dernier projet au lieu
   de la laisser descendre vers Parcours. Le calage est donc écrit dans le
   script, avec une garde qui le désactive aux deux bouts de la liste. Voir
   settle() et RECENTRAGE. */
.row {
  position: relative;
  height: var(--row-h);
  display: block;
  width: 100%;
  border: 0;
  padding: 0;
  background: none;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* La loi du flou est écrite par le script directement sur cet élément, en
   filter et en opacity, et non en CSS depuis une custom property posée sur la
   ligne : écrire une custom property sur la ligne invalidait le style de tout
   son sous-arbre, grille, titre et SVG compris, à chaque image.
   contain: paint borne la zone à repeindre à la boîte de la ligne. Sans lui,
   changer le rayon d'un flou plein écran pendant que la page défile laissait
   des tuiles de l'image précédente sur le visuel, un rectangle plus clair en
   travers du projet suivant. */
.row__inner {
  height: 100%;
  contain: paint;
}

/* Une seule situation où le dénettage est animé : le clic sur une ligne
   floue. Le rayon de flou, lui, tombe d'un coup à zéro, il n'est pas
   interpolé : animer un flou plein écran pendant 160ms coûte une dizaine de
   rastérisations complètes au moment précis où le défilement démarre, et
   c'est la seule image du parcours qui ne peut pas se permettre de sauter.
   L'opacité, gratuite pour le compositeur, porte la continuité du geste. */
.row[data-claimed] .row__inner { transition: opacity 120ms var(--ease-out); }

/* Le registre : quatre colonnes alignées d'une ligne à l'autre, un filet
   au-dessus de chacune. C'est la seule lecture qui laisse balayer les dates
   en colonne. */
.row__grid {
  height: 100%;
  display: grid;
  align-items: center;
  grid-template-columns: 96px minmax(0, 1fr) 200px 320px;
  gap: 40px;
  border-top: 1px solid var(--color-hairline);
  transition: border-top-color 220ms var(--ease-out);
}
/* Le filet au-dessus du projet net vire à l'Ember. Un trait de 1px à 42% :
   assez pour poser un repère horizontal dans un écran qui n'en a aucun, trop
   peu pour devenir un second marqueur de focus en concurrence avec le flou. */
.row[data-net] .row__grid { border-top-color: rgba(250, 82, 15, 0.42); }
.row:first-of-type .row__grid,
.row[data-net]:first-of-type .row__grid { border-top-color: transparent; }

/* Sur large, les trois champs de gauche sont des colonnes de plein rang, au
   même titre que le visuel. Sur mobile, la pile reprend ses droits. */
.stack { display: contents; }

/* ---- Champs typographiques --------------------------------------------- */
/* La date reste neutre. Elle avait été teintée en Ember encre sur le projet
   net : seul champ coloré de tout l'écran, elle formait un accent isolé que
   rien d'autre ne reprenait. Une couleur qui n'apparaît qu'une fois n'est pas
   un système, c'est une exception. */
.f-date {
  font-size: 13px;
  font-weight: var(--weight-body);
  letter-spacing: -0.004em;
  color: var(--color-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.f-name {
  margin: 0;
  font-size: 44px;
  line-height: 1.1;
  letter-spacing: -0.032em;
  font-weight: var(--weight-title);
}

/* Deux lignes maximum puis troncature : la hauteur de ligne ne bouge pas,
   sinon le calage devient imprévisible.
   Pas de soulignement permanent du projet net. Le flou dit déjà lequel est le
   sujet, un trait en plus serait un second marqueur pour une seule
   information. */
.f-name__u {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-decoration: 2px solid underline transparent;
  text-underline-offset: 6px;
  transition: text-decoration-color 150ms var(--ease-out);
}

/* Le survol ne concerne QUE le projet net : c'est le seul dont le clic mène
   quelque part. Survoler un projet flou n'annonce rien, son clic ne fait que
   le recentrer. Un survol qui promet la même chose dans les deux cas ment une
   fois sur deux. Sous (hover: none) la règle ne s'applique pas du tout. */
@media (hover: hover) and (pointer: fine) {
  .row[data-net]:hover .f-name__u { text-decoration-color: var(--color-ember); }
}
.row[data-net]:focus-visible .f-name__u { text-decoration-color: var(--color-ember); }

.f-theme {
  font-size: 17px;
  font-weight: var(--weight-body);
  letter-spacing: -0.008em;
  color: var(--color-muted);
}

/* ---- Le visuel ----------------------------------------------------------
   Il porte deux choses : le zoom lent quand la ligne est nette, et le flou de
   chargement progressif quand il n'est pas encore chargé.
   ---------------------------------------------------------------------- */
.visual {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background: var(--color-soft-butter);
  aspect-ratio: 16 / 10;
  width: 100%;
  /* Le visuel est la seule surface de la ligne qui bouge en permanence, entre
     le zoom lent et le dénettage de chargement. Isolé, il ne force pas le
     repeint du texte à côté de lui. */
  isolation: isolate;
}
.visual__img {
  position: absolute;
  inset: 0;
  /* width et height explicites, et pas seulement inset: 0. Un SVG est un
     élément remplacé : avec des dimensions auto il garde le ratio de son
     viewBox et se contente de la largeur, en laissant le bas de la boîte
     vide. Le recadrage est fait par preserveAspectRatio="slice". */
  width: 100%;
  height: 100%;
  transform-origin: 50% 50%;
  transition: filter 420ms var(--ease-out), transform 420ms var(--ease-out);
}
/* Tant que data-loading est là, l'image reste floue. Si elle ne charge
   jamais, ce flou reste, plutôt que de laisser un trou. */
.visual[data-loading] .visual__img {
  filter: blur(18px);
  transform: scale(1.06);
}

/* Le zoom lent ne boucle pas et ne repart pas en arrière : une dérive infinie
   sur le visuel que le recruteur est en train de regarder est du mouvement
   décoratif sur du contenu évalué. Ce qui reste a un sens, et un seul : le
   projet net est vivant, les autres sont figés. Donc une seule passe, en
   avant, qui se pose et s'arrête.
   Le délai de 420ms laisse d'abord finir le dénettage de chargement, dont la
   transition sur transform serait sinon écrasée par l'animation. */
@keyframes slow-zoom {
  from { transform: scale(1); }
  to   { transform: scale(1.04); }
}
.row[data-net] .visual:not([data-loading]) .visual__img {
  animation: slow-zoom 12s linear 420ms forwards;
}

/* ===========================================================================
   LA SORTIE VERS PARCOURS, le halo.

   Collé au bas de la fenêtre, il ne défile pas avec la liste : c'est un
   panneau de direction, pas un décor, et un panneau qui s'en va quand on
   avance ne sert à rien.
   Rampe de 140px, plafond à 30%. En dessous de 140 la rampe redevient un bord
   et perd ce qui fait le halo, au-dessus elle mord sur le projet suivant.
   Le mot est en Suie, jamais en Papier : #fffaeb sur #fa520f tombe à 2,9:1 et
   échoue AA. Suie sur un halo à 30% tient 12:1.
   ======================================================================== */
.outro {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 4;
  height: var(--halo-h);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 24px;
  pointer-events: none;
  background: linear-gradient(to top,
    rgba(250, 82, 15, 0.30) 0%,
    rgba(250, 82, 15, 0.18) 34%,
    rgba(250, 82, 15, 0.07) 66%,
    rgba(255, 250, 235, 0) 100%);
}
.outro__link {
  pointer-events: auto;
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 14px;
  border-radius: 6px;
  font-size: 17px;
  font-weight: var(--weight-title);
  letter-spacing: -0.008em;
  color: var(--color-suie);
  text-decoration: none;
}
.outro__word {
  text-decoration: 2px solid underline transparent;
  text-underline-offset: 5px;
  transition: text-decoration-color 150ms ease;
}
.outro__link:hover .outro__word,
.outro__link:focus-visible .outro__word { text-decoration-color: currentColor; }
/* La flèche de l'ancre, en Ember plein. C'est l'emploi prévu par le système,
   l'Ember vit dans les remplissages et les icônes ; l'Ember encre est réservé
   au texte, et ce n'en est pas. Le mot à côté reste en Suie, c'est lui qui
   porte la lisibilité. */
.outro__arrow { color: var(--color-ember); transition: transform 220ms var(--ease-out); }
.outro__link:hover .outro__arrow { transform: translateY(2px); }

/* ===========================================================================
   PROJETS, MOBILE. Même comportement, aucun mécanisme au survol.
   Date, nom et thème s'empilent à gauche, le visuel reste à droite.
   ======================================================================== */
@media (max-width: 860px) {
  .projets {
    --focus-top: 164px;     /* 64 de bandeau, plus les 100 du prototype */
    --header-h: 64px;
    --halo-h: 112px;
    --fade-top: 64px;
    /* Le flou reste proportionnel à l'écran, mais le facteur remonte à 0,75 :
       la rampe desktop a été divisée par près de trois, la couper encore de
       moitié rendrait le flou invisible sur téléphone. */
    --blur-scale: 0.75;
  }

  /* Le visuel reste en 16/10, comme sur desktop : un format qui change d'un
     support à l'autre obligerait à recadrer chaque visuel deux fois, et le
     même projet ne se reconnaîtrait pas d'un écran à l'autre. La ligne haute
     se paie en air autour du visuel, pas en recadrage. */
  .row__grid { grid-template-columns: minmax(0, 1fr) 46vw; gap: 18px; }
  .stack { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .f-name { font-size: 28px; letter-spacing: -0.024em; }
  .f-theme { font-size: 15px; }
}

/* ===========================================================================
   PARCOURS

   La seule section du site qui quitte le parchemin. Fond Ember encre en
   pleine largeur, encre papier. L'écart à la charte est délibéré : cette
   section est le point de rupture chromatique du parcours de lecture, et
   c'est ce qui la rend mémorable après coup.

   Contrainte que le fond impose : Suie ne mesure que 3.5:1 sur Ember encre,
   le texte noir y est donc interdit. Tout passe en papier, 5.1:1, et le
   secondaire à 76 % reste au dessus du plancher AA.
   ======================================================================== */
.parcours {
  --ground: #c04408;
  --ink: var(--color-papier);
  --ink-muted: rgba(255, 253, 246, 0.76);
  --line: rgba(255, 253, 246, 0.26);
  --wash: rgba(255, 253, 246, 0.10);

  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 96px var(--gutter);
  background: var(--ground);
  color: var(--ink);
}
/* Sur ce fond, un liseré Ember n'existe pas. */
.parcours :focus-visible { outline-color: var(--color-papier); }

/* La composition ne couvre pas la page, elle s'y pose : largeur bornée,
   colonnes centrées l'une sur l'autre, de l'air tout autour. */
.parcours__split {
  width: 100%;
  max-width: 1120px;
  display: grid;
  grid-template-columns: 440px minmax(0, 1fr);
  gap: 80px;
  align-items: center;
}
.parcours__aside { display: flex; justify-content: center; }

/* Le canvas est transparent : le fond de la section le traverse, il n'y a
   donc qu'une seule surface colorée dans tout l'écran. */
.sphere { position: relative; width: min(100%, 520px); aspect-ratio: 1; }
.sphere canvas { display: block; width: 100%; height: 100%; }

/* ---- La liste ----------------------------------------------------------
   La ligne fermée porte l'employeur, la période ET le métier. Le visiteur
   qui consulte en diagonale cherche les trois : les cacher derrière un clic
   allongeait son chemin sans rien simplifier.
   ---------------------------------------------------------------------- */
.xp-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.xp { border-bottom: 1px solid var(--line); }

.xp__head {
  display: grid;
  grid-template-columns: 7px 1fr auto;
  align-items: baseline;
  column-gap: 12px;
  width: calc(100% + 24px);
  margin-inline: -12px;
  padding: 24px 12px;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  border-radius: 8px;
  transition: background-color 150ms ease;
}
@media (hover: hover) and (pointer: fine) { .xp__head:hover { background: var(--wash); } }
.xp__head:active { background: rgba(255, 253, 246, 0.16); }

.xp__name { font-size: 22px; font-weight: var(--weight-title); line-height: 1.28; letter-spacing: -0.02em; }
/* 550 entre le 600 du nom et le 470 du texte : le palier intermédiaire fait
   lire la hiérarchie comme une pente et non comme une marche. */
.xp__role { grid-column: 2; font-size: 17px; font-weight: var(--weight-lede); color: var(--ink-muted); }
.xp__dates { grid-row: 1; grid-column: 3; font-size: 17px; color: var(--ink-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* La puce de 7px, l'idiome d'état du système. Elle occupe sa place en
   permanence : ouvrir une fiche ne décale aucun texte. */
.xp__mark {
  grid-row: 1; grid-column: 1;
  width: 7px; height: 7px; border-radius: 999px;
  background: var(--color-papier);
  align-self: center;
  transform: scale(0);
  opacity: 0;
  transition: transform 180ms var(--ease-out), opacity 180ms var(--ease-out);
}
.xp[data-open] .xp__mark { transform: scale(1); opacity: 1; }
@media (hover: hover) and (pointer: fine) {
  .xp:not([data-open]) .xp__head:hover .xp__mark { transform: scale(1); opacity: .45; }
}

/* Dépliage sur grid-template-rows : la hauteur réelle est animée sans mesure
   JS, et un second clic retargette depuis la hauteur courante.
   Sans JavaScript, tout est déplié : aucun contenu n'est inaccessible. */
.xp__fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 220ms var(--ease-out); }
.xp__foldInner { overflow: hidden; }
.xp__body { padding: 0 0 28px 19px; max-width: 46ch; margin: 0; color: var(--ink-muted); }

.parcours[data-js] .xp__fold { grid-template-rows: 0fr; }
.parcours[data-js] .xp[data-open] .xp__fold { grid-template-rows: 1fr; }
.parcours[data-js] .xp__body {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 180ms var(--ease-out) 40ms, transform 180ms var(--ease-out) 40ms;
}
.parcours[data-js] .xp[data-open] .xp__body { opacity: 1; transform: none; }

/* Le bandeau fixe reprend le fond de la section quand elle passe dessous.
   Sans ça, une barre parchemin traverse l'orange et lit comme un défaut. */
.site-header[data-ember] {
  background: #c04408;
  color: var(--color-papier);
  --color-wash: rgba(255, 253, 246, 0.12);
}
.site-header[data-ember] :focus-visible { outline-color: var(--color-papier); }

@media (max-width: 980px) {
  /* Une colonne, la sphère d'abord. Sans souris il n'y a pas de survol :
     c'est le clic qui la fait réagir, et la voir avant la liste dit à quoi
     le clic va servir. */
  .parcours { padding: 72px var(--gutter) 48px; place-items: start center; }
  .parcours__split { display: flex; flex-direction: column; gap: 40px; }
  .parcours__aside { order: -1; width: 100%; }
  .sphere { width: min(100%, 320px); }
  .xp__name { font-size: 20px; }
}

/* ===========================================================================
   REDUCED MOTION, etat statique equivalent. Aucune information, aucune
   action n'est perdue par rapport a la version animee.
   ======================================================================== */
@media (prefers-reduced-motion: reduce) {
  .rise { animation: none; opacity: 1; transform: none; }
  .site-header,
  .anchor-slot,
  .anchor__arrow,
  .toast { transition-duration: 1ms !important; }
  .toast { transform: none !important; }
  .anchor:hover .anchor__arrow,
  .anchor:focus-visible .anchor__arrow { transform: none; }

  .xp__fold, .xp__body, .xp__mark, .xp__head { transition-duration: 1ms !important; }
  .parcours[data-js] .xp__body { transform: none !important; }

  /* Projets. Le zoom saute, le recentrage et les transitions de focus
     deviennent instantanes. Le flou, lui, reste : c'est une information de
     hierarchie, pas une animation. */
  .row[data-net] .visual .visual__img { animation: none; }
  .visual__img,
  .f-name__u,
  .row__grid,
  .projets__fade,
  .outro,
  .outro__arrow { transition-duration: 1ms !important; }
  /* Exception : le denettage garde ses 120ms. C'est le seul accuse de
     reception du clic sur une ligne floue, le faire basculer d'un coup
     reviendrait a ne rien repondre. */
  .row[data-claimed] .row__inner { transition-duration: 120ms; }
}

/* ===========================================================================
   PAGE PROJET, la carte superposée
   ===========================================================================

   La page projet ne remplace pas la liste, elle se pose dessus. Sur
   téléphone, une feuille qui monte du bas et laisse voir la liste au-dessus
   d'elle. Sur ordinateur, une fenêtre centrée de la même famille, même rayon
   et même matière. Dans les deux cas la liste reste derrière, et la refermer
   c'est y revenir, sans rechargement ni réorientation.

   Tout est préfixé pj- : la carte croise .hero et .visual, qui existent déjà
   sur cette page avec un tout autre sens.

   La matière est Surface, décidée avec Mathieu. Deux valeurs s'inversent par
   rapport au système clair : l'Ember encre #c04408, qui est la version
   lisible de l'orange sur parchemin, tombe à 3,1:1 sur Surface, il redevient
   un fond. C'est l'Ember plein #fa520f qui passe à 6,1:1 et devient le ton de
   texte. Un hex de marque et un hex lisible ne sont pas la même chose, et ils
   échangent leurs rôles quand le fond change.
   ======================================================================== */
:root {
  --pj-bg: var(--color-surface);
  --pj-bg-2: #262420;
  --pj-ink: var(--color-parchment-canvas);
  --pj-ink-muted: rgba(255, 250, 235, 0.64);
  --pj-rule: rgba(255, 250, 235, 0.14);
  --pj-accent-ink: var(--color-ember);
  /* Sur fond sombre le callout ne peut plus être un aplat beurre : il
     éclairerait la carte entière pour porter une phrase. La couleur passe
     dans le filet, le fond reste une nuance du fond. */
  --pj-callout-bg: rgba(255, 250, 235, 0.06);
  --pj-result-bg: var(--color-ember-ink);
  --pj-result-ink: var(--color-parchment-canvas);
  --pj-result-ink-muted: rgba(255, 250, 235, 0.74);

  --pj-ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  /* Le même rayon sur les deux appareils : c'est ce qui fait reconnaître le
     même objet d'un support à l'autre. */
  --pj-radius: 20px;
  /* Ce qui reste de la page au-dessus de la feuille sur téléphone. Assez pour
     qu'on voie qu'elle est toujours là, trop peu pour qu'on croie pouvoir y
     lire quelque chose. */
  --pj-peek: 56px;
  --pj-pad: 24px;
}

/* La page derrière recule. Le transform est posé sur main et non sur body :
   l'en-tête est fixe et sortirait de son ancrage.
   Deux durées, pas une. Elle recule en 420ms avec la feuille qui monte, elle
   revient en 300ms : à la fermeture la liste est la destination, la faire
   attendre serait du remords. */
main {
  transform-origin: 50% 0%;
  transition: transform 300ms var(--pj-ease-drawer), filter 300ms var(--pj-ease-drawer);
}
body[data-projet] main {
  transform: scale(0.94) translateY(12px);
  filter: brightness(0.94);
  transition-duration: 420ms;
}

/* Un élément en position fixe dans un ancêtre transformé se repositionne sur
   cet ancêtre : le fondu et le halo de Projets partiraient au bas du
   document. Ils n'ont rien à dire sous un voile, ils partent tout de suite.
   La spécificité suffit, l'attribut sur body passe devant les règles de
   chrome plus haut.

   Ils restent partis pendant la sortie, le temps que main revienne à
   l'échelle 1 : les rendre pendant que la transformation court les ferait
   réapparaître au mauvais endroit, puis sauter à leur place. */
body[data-projet] .site-header { transform: translateY(-100%); }
body[data-projet] .projets__fade,
body[data-projet] .projets[data-chrome] .projets__fade,
body[data-projet] .outro,
body[data-projet] .projets[data-chrome] .outro,
body[data-pj-sortie] .projets__fade,
body[data-pj-sortie] .projets[data-chrome] .projets__fade,
body[data-pj-sortie] .outro,
body[data-pj-sortie] .projets[data-chrome] .outro {
  opacity: 0;
  visibility: hidden;
  transition: none;
}

/* Le voile. Il ne noircit pas, il chauffe : sur du parchemin un scrim noir
   vire au gris et sort de la palette. Calé sur la feuille, aux deux sens : un
   voile qui a sa propre durée se détache de l'objet qu'il accompagne et
   redevient un calque. */
.pj-scrim {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(23, 22, 19, 0.28);
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms var(--ease-out);
}
body[data-projet] .pj-scrim {
  opacity: 1;
  pointer-events: auto;
  transition-duration: 420ms;
}

/* ---------------------------------------------------------------------------
   LA FEUILLE. Ancrée en bas, elle monte. Elle s'arrête à 56px du haut, la
   page dépasse, la sortie est évidente avant même de chercher un bouton.
   ------------------------------------------------------------------------ */
.pj-sheet {
  position: fixed;
  z-index: 210;
  left: 0; right: 0; bottom: 0; top: var(--pj-peek);
  display: flex;
  flex-direction: column;
  background: var(--pj-bg);
  color: var(--pj-ink);
  overflow: hidden;
  isolation: isolate;
  border-radius: var(--pj-radius) var(--pj-radius) 0 0;
  box-shadow: 0 -2px 24px rgba(23, 22, 19, 0.18), 0 -1px 0 rgba(23, 22, 19, 0.06);
  transform: translateY(100%);
  /* 300ms à la fermeture, 420ms à l'ouverture. À l'ouverture on regarde un
     objet arriver, à la fermeture la décision est prise : rejouer les 420ms
     serait faire patienter quelqu'un qui est déjà parti. */
  transition: transform 300ms var(--pj-ease-drawer);
  /* pan-y pour que le contenu défile au doigt ; le geste de renvoi est repris
     à la main dans le script, depuis le haut du contenu. */
  touch-action: pan-y;
  -webkit-mask-image: -webkit-radial-gradient(white, black);
  mask-image: radial-gradient(white, black);
  will-change: transform;
}
body[data-projet] .pj-sheet { transform: translateY(0); transition-duration: 420ms; }

/* Fermée, la carte ne se clique pas. Sur ordinateur elle reste centrée et
   seulement transparente : sans cette ligne elle intercepterait les clics au
   milieu de la page. Le script pose inert en plus, qui la sort de l'ordre de
   tabulation et de l'arbre d'accessibilité sans la retirer du flux, donc sans
   empêcher le trajet de sortie de se jouer. */
.pj-sheet { pointer-events: none; }
body[data-projet] .pj-sheet { pointer-events: auto; }

/* Pendant le geste, plus rien ne doit se sélectionner sous le doigt ou le
   curseur : le tirage n'est pas une lecture. */
body[data-pj-drag] { user-select: none; -webkit-user-select: none; cursor: grabbing; }

/* La poignée. Elle ne sert à rien de fonctionnel, elle annonce que la feuille
   se tire. Téléphone seulement : sur ordinateur elle mentirait. */
.pj-grab {
  position: absolute;
  top: 8px; left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  width: 40px; height: 4px;
  border-radius: 999px;
  background: rgba(255, 250, 235, 0.3);
  touch-action: none;
}
/* Le trait fait 40 x 4 px, la zone qu'on vise en fait 120 x 32. On tire une
   poignée approximativement, jamais au pixel. */
.pj-grab::after { content: ''; position: absolute; inset: -14px -40px; }

/* L'en-tête de la carte tire toujours la feuille, même quand le contenu est
   défilé : c'est la partie de l'objet qu'on saisit, pas une partie du
   document qu'on lit. */
.pj-topbar { touch-action: none; }

/* La croix. Toujours au même endroit, toujours au-dessus du contenu, y
   compris sur le visuel : c'est la sortie, elle ne se cherche pas. Sur
   Surface, un disque parchemin plein ferait un trou de lumière en haut à
   droite d'une carte sombre. Le même objet, en verre teinté. */
.pj-close {
  position: absolute;
  z-index: 4;
  top: 14px; right: 14px;
  width: 34px; height: 34px;
  border: 0; border-radius: 999px;
  display: grid; place-items: center;
  background: rgba(255, 250, 235, 0.14);
  color: var(--color-parchment-canvas);
  box-shadow: inset 0 0 0 1px rgba(255, 250, 235, 0.18);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  cursor: pointer;
  transition: background-color 160ms ease, transform 110ms var(--ease-out);
}
.pj-close:active { transform: scale(0.94); }
@media (hover: hover) and (pointer: fine) {
  .pj-close:hover { background: rgba(255, 250, 235, 0.22); }
}

/* Le défilement a lieu dans la feuille, jamais derrière. */
.pj-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

/* Barre interne, révélée au défilement. Elle ne sert qu'à une chose : redire
   quel projet on lit une fois le titre parti en haut. */
.pj-topbar {
  position: sticky;
  top: 0;
  z-index: 3;
  height: 62px;
  margin-bottom: -62px;
  display: flex; align-items: center;
  padding: 0 60px 0 var(--pj-pad);
  background: color-mix(in srgb, var(--pj-bg) 88%, transparent);
  -webkit-backdrop-filter: blur(12px) saturate(1.3); backdrop-filter: blur(12px) saturate(1.3);
  border-bottom: 1px solid transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms var(--ease-out), border-color 180ms var(--ease-out);
}
.pj-scroll[data-scrolled] .pj-topbar { opacity: 1; border-bottom-color: var(--pj-rule); }
.pj-topbar__t {
  margin: 0;
  font-size: 17px; font-weight: var(--weight-lede); letter-spacing: -0.008em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------------------------------------------------------------------------
   L'ÉCRAN D'OUVERTURE. Quatre informations, rien d'autre : le nom du projet,
   ce qu'il a produit, le client, la date.

   Il occupe exactement la hauteur de la carte, jamais un pixel de plus, et le
   premier chapitre ne dépasse pas dessous. C'est un choix coûteux, on
   sacrifie l'amorce de lecture qui fait défiler, et c'est le prix d'une
   entrée qui se lit d'un regard au lieu d'être survolée.

   Le chevron du bas paie cette dette : sans lui, rien ne dirait qu'il y a une
   suite. Il n'est pas une décoration, il est la seule preuve que la carte
   continue.
   ------------------------------------------------------------------------ */
.pj-hero {
  position: relative;
  min-height: 100%;
  display: flex; flex-direction: column; justify-content: center;
  padding: 72px var(--pj-pad) 64px;
}
.pj-title {
  margin: 0 0 20px;
  font-weight: var(--weight-title);
  font-size: clamp(38px, 10vw, 52px);
  line-height: 1.04; letter-spacing: -0.036em;
  max-width: 15ch;
}
.pj-chapo {
  margin: 0 0 24px;
  font-size: 20px; font-weight: var(--weight-body);
  line-height: 1.55; letter-spacing: -0.016em;
  max-width: 44ch;
  color: var(--pj-ink);
}
.pj-meta {
  margin: 0; padding: 0; list-style: none;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
  font-size: 15px; font-weight: var(--weight-lede); color: var(--pj-ink-muted);
}
.pj-meta li:not(:last-child)::after { content: '·'; margin-left: 10px; opacity: 0.5; }
.pj-meta li:first-child { color: var(--pj-ink); }
.pj-hint {
  position: absolute;
  left: 50%; bottom: 22px;
  transform: translateX(-50%);
  color: var(--color-ember);
  transition: opacity 200ms var(--ease-out);
}
.pj-scroll[data-moved] .pj-hint { opacity: 0; }

/* ---------------------------------------------------------------------------
   LES CHAPITRES. Pas de numérotation, pas de lettre STAR. Le cadre STAR reste
   l'ossature d'écriture, il cesse d'être un affichage : « 01 . S » ne dit
   rien à un recruteur, il ne connaît pas le gabarit, il connaît les
   questions. Ce sont donc les questions qui restent, en titre.
   ------------------------------------------------------------------------ */
.pj-body { padding: 0 var(--pj-pad); }
.pj-chap { padding: 28px 0 24px; }
.pj-chap:first-child { padding-top: 40px; }
.pj-chap:last-child { padding-bottom: 40px; }
.pj-chap__h {
  margin: 0 0 14px;
  font-size: 22px; font-weight: var(--weight-title);
  line-height: 1.28; letter-spacing: -0.02em;
  text-decoration: underline;
  text-decoration-color: var(--color-ember);
  text-decoration-thickness: 2px;
  text-underline-offset: 6px;
}
.pj-chap p { margin: 0 0 14px; max-width: 46ch; }
.pj-chap p:last-child { margin-bottom: 0; }

/* Le callout d'objectif. Une phrase, et une seule : l'objectif d'un projet
   qui tient en trois phrases n'est pas un objectif, c'est un résumé. Le
   périmètre reste sous la phrase, en petit, parce qu'il répond à l'autre
   question du recruteur, ce qui n'était pas de toi. */
.pj-callout { margin: 0; max-width: 44ch; }
.pj-callout p {
  margin: 0;
  font-size: 22px; font-weight: var(--weight-lede); font-style: italic;
  line-height: 1.45; letter-spacing: -0.02em;
}
.pj-callout__perim {
  display: block;
  margin-top: 12px;
  font-size: 14px; font-weight: var(--weight-body); line-height: 1.55;
  color: var(--pj-ink-muted);
}
.pj-callout__perim b { font-weight: var(--weight-lede); color: var(--pj-ink); }

/* Le média de présentation. Pleine largeur, sans rayon : il touche les deux
   bords de la carte pour se lire comme une fenêtre sur le projet et non comme
   une illustration posée dans le texte. Emplacement réservé par un ratio,
   flou qui se lève, aucun saut de mise en page. */
.pj-media { margin: 0; position: relative; }
.pj-media .pj-visual { border-radius: 0; aspect-ratio: 16 / 9; }
.pj-media .pj-cap { padding: 10px var(--pj-pad) 0; margin: 0; }

.pj-figure { margin: 20px 0 0; }
.pj-visual {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  aspect-ratio: 16 / 10;
  background: linear-gradient(160deg, #fff0c2, #fcb07a);
}
.pj-visual svg { display: block; width: 100%; height: 100%; }
.pj-visual__img { transition: filter 420ms var(--ease-out), transform 420ms var(--ease-out); }
.pj-visual[data-loading] .pj-visual__img { filter: blur(18px); transform: scale(1.06); }
.pj-cap {
  margin: 8px 2px 0;
  font-size: 13px; line-height: 1.5; letter-spacing: -0.004em;
  color: var(--pj-ink-muted);
}

/* Le bouton de lecture. Rond, en verre, la flèche en Ember : l'orange est un
   signal, il ne remplit pas un disque de 56px. La zone cliquable couvre tout
   le média, la pastille n'est que sa cible visible : viser un disque de 56px
   au pouce est un test d'adresse. */
.pj-play {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid; place-items: center;
  border: 0; background: none; padding: 0;
  cursor: pointer;
}
.pj-play__d {
  width: 56px; height: 56px;
  border-radius: 999px;
  display: grid; place-items: center;
  background: rgba(255, 250, 235, 0.92);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: 0 2px 10px rgba(23, 22, 19, 0.24);
  color: var(--color-ember);
  transition: transform 140ms var(--ease-out), opacity 160ms ease;
}
.pj-play:active .pj-play__d { transform: scale(0.94); }
@media (hover: hover) and (pointer: fine) { .pj-play:hover .pj-play__d { transform: scale(1.04); } }
.pj-play__pause { display: none; }
.pj-media[data-playing] .pj-play__play { display: none; }
.pj-media[data-playing] .pj-play__pause { display: block; }
/* Pendant la lecture la pastille s'efface, elle reviendra au survol ou au
   toucher : on ne pose pas un disque opaque au milieu de ce qu'on regarde. */
.pj-media[data-playing] .pj-play__d { opacity: 0; }
.pj-media[data-playing] .pj-play:hover .pj-play__d,
.pj-media[data-playing] .pj-play:focus-visible .pj-play__d { opacity: 1; }
/* Le média définitif sera une vidéo. En attendant, un lent travelling : la
   seule façon honnête de dire « ça joue » sans encoder une vidéo. */
.pj-media[data-playing] .pj-visual__img { animation: pj-play-zoom 16s linear both; }
@keyframes pj-play-zoom { from { transform: scale(1); } to { transform: scale(1.12); } }

/* ---------------------------------------------------------------------------
   LE RÉSULTAT, pleine largeur en Ember encre. C'est le seul moment où la
   carte change de matière. Le bloc qui porte la preuve devient un objet
   différent du reste, repérable en diagonale sans avoir à le lire. Il n'a pas
   de visuel : une image ici ferait un second sujet au moment précis où il
   n'en faut qu'un.
   ------------------------------------------------------------------------ */
.pj-result {
  background: var(--pj-result-bg);
  color: var(--pj-result-ink);
  padding: 36px var(--pj-pad) 40px;
}
.pj-result .pj-chap { padding: 0; }
.pj-result .pj-chap__h { color: var(--pj-result-ink); text-decoration: none; }
.pj-result p { max-width: 46ch; color: var(--pj-result-ink); }
/* Sur ce fond, un liseré Ember n'existe pas. */
.pj-result :focus-visible { outline-color: var(--color-papier); }
/* Les sorties du bloc Résultat. Deux liens au plus, vers la preuve : le
   livrable consultable en ligne, et le code qui le produit. Ils ferment la
   page, ils ne concurrencent pas le texte. */
.pj-sorties { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.pj-lien {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  border: 1px solid transparent;
  background: var(--pj-result-ink); color: var(--pj-result-bg);
  font-size: 15px; font-weight: var(--weight-lede); line-height: 1;
  text-decoration: none;
  transition: opacity 180ms ease, background-color 180ms ease;
}
.pj-lien:hover, .pj-lien:focus-visible { opacity: 0.78; }
/* Le code est une seconde lecture, pas la preuve. Le contour le dit sans le
   reléguer : même gabarit, une encre en moins. L'opacité ne descend pas sous
   0.7 : le filet est le seul contour du bouton, il lui faut ses 3:1. */
.pj-lien--code {
  background: transparent; color: var(--pj-result-ink);
  border-color: rgba(255, 250, 235, 0.7);
}
.pj-lien--code:hover, .pj-lien--code:focus-visible {
  opacity: 1; background: rgba(255, 250, 235, 0.1);
}
.pj-lien .icon--github { width: 16px; height: 16px; flex: none; }
.pj-figs { display: flex; flex-wrap: wrap; gap: 18px 40px; margin: 0 0 20px; padding: 0; list-style: none; }
.pj-fig__n {
  display: block;
  font-size: 32px; font-weight: var(--weight-title);
  line-height: 1.1; letter-spacing: -0.028em;
  font-variant-numeric: tabular-nums;
}
.pj-fig__l {
  display: block;
  font-size: 13px; font-weight: var(--weight-lede); line-height: 1.4;
  color: var(--pj-result-ink-muted);
}

/* ---------------------------------------------------------------------------
   PIED DE CARTE. Enchaîner, ou sortir. Dans une carte, « suivant » ne change
   pas de page : il remplace le contenu de la carte, la liste reste où elle
   est. Un seul projet est écrit pour l'instant, il n'y a donc qu'une carte,
   le retour à la liste.
   ------------------------------------------------------------------------ */
.pj-foot { border-top: 1px solid var(--pj-rule); }
.pj-navs { display: grid; }
.pj-navc {
  display: flex; flex-direction: column; gap: 2px;
  padding: 18px var(--pj-pad) 20px;
  border-bottom: 1px solid var(--pj-rule);
  cursor: pointer;
  text-decoration: none;
  transition: background-color 160ms ease;
}
/* La flèche est une marque, pas le début de la ligne. Le titre et le nombre
   se calent sur le mot du dessus, jamais sur la pointe : sinon les trois
   lignes de la carte partent de trois endroits différents. Le retrait vaut
   la flèche plus son écart, et il passe à droite quand la carte est à
   droite. */
.pj-navc__t, .pj-navc__y { padding-left: calc(14px + 8px); }
.pj-navc--next { text-align: right; align-items: flex-end; }
.pj-navc--next .pj-navc__k { flex-direction: row-reverse; }
.pj-navc--next .pj-navc__t,
.pj-navc--next .pj-navc__y { padding-left: 0; padding-right: calc(14px + 8px); }
@media (hover: hover) and (pointer: fine) {
  .pj-navc:hover { background: var(--pj-bg-2); }
  .pj-navc--next:hover .pj-navc__a { transform: translateX(4px); }
  .pj-navc--prev:hover .pj-navc__a { transform: translateX(-4px); }
}
.pj-navc__k {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: var(--weight-title);
  letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--pj-ink-muted);
}
.pj-navc__a { color: var(--color-ember); transition: transform 180ms var(--ease-out); }
.pj-navc__t { font-size: 20px; font-weight: var(--weight-title); letter-spacing: -0.02em; line-height: 1.3; }
.pj-navc__y { font-size: 13px; color: var(--pj-ink-muted); }

.pj-contact {
  padding: 20px var(--pj-pad) calc(24px + env(safe-area-inset-bottom));
  display: flex; flex-wrap: wrap; gap: 12px 20px;
  align-items: center; justify-content: space-between;
}
.pj-contact p { margin: 0; font-size: 17px; font-weight: var(--weight-lede); max-width: 28ch; }
/* Sur Surface, un bouton plein Suie se fondrait dans le fond. Il s'inverse :
   parchemin plein, texte Suie. Le rapport de force est conservé, c'est
   toujours la seule zone pleine de la carte. */
.pj-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px;
  border-radius: 6px;
  border: 1px solid var(--color-parchment-canvas);
  background: var(--color-parchment-canvas);
  color: var(--color-suie);
  font-family: inherit; font-size: 15px; font-weight: var(--weight-title);
  cursor: pointer;
  text-decoration: none;
  transition: background-color 160ms ease, transform 110ms var(--ease-out);
}
.pj-btn:active { transform: scale(0.98); }
.pj-btn svg { color: var(--color-ember-ink); }
@media (hover: hover) and (pointer: fine) { .pj-btn:hover { background: var(--color-papier); } }

/* ---------------------------------------------------------------------------
   ORDINATEUR. Même objet, posé au centre : il n'y a pas de bas d'écran vers
   lequel glisser, il ne monte donc pas, il s'approche.
   ------------------------------------------------------------------------ */
@media (min-width: 861px) {
  .pj-grab { display: none; }
  .pj-topbar { touch-action: auto; }

  /* Le fond ne recule presque pas, mais il doit tenir la même durée que la
     carte : à 420ms il finissait de bouger après elle, et on voyait deux
     objets au lieu d'un. */
  main { transition: transform 200ms var(--ease-out), filter 200ms var(--ease-out); }
  body[data-projet] main { transform: scale(0.985); transition-duration: 260ms; }

  .pj-scrim {
    background: rgba(23, 22, 19, 0.34);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    transition-duration: 200ms;
  }
  body[data-projet] .pj-scrim { transition-duration: 260ms; }

  .pj-sheet {
    left: 50%; top: 50%; right: auto; bottom: auto;
    width: min(960px, calc(100vw - 96px));
    height: min(88dvh, 940px);
    border-radius: var(--pj-radius);
    box-shadow: var(--shadow-xl), 0 24px 64px rgba(23, 22, 19, 0.22);
    transform: translate(-50%, -50%) scale(0.97);
    opacity: 0;
    transition: transform 200ms var(--ease-out), opacity 160ms var(--ease-out);
  }
  /* 260ms pour s'approcher, 200ms pour partir. L'opacité reste un cran sous
     le mouvement dans les deux sens : la carte est déjà pleinement visible
     quand elle finit de se poser, elle ne clignote pas. */
  body[data-projet] .pj-sheet {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    transition-duration: 260ms, 200ms;
  }

  .pj-hero { padding: 96px 48px 72px; }
  .pj-title { font-size: 66px; max-width: 13ch; }
  .pj-chapo { font-size: 22px; max-width: 48ch; }
  .pj-body { padding-inline: 48px; }
  .pj-media .pj-cap { padding-inline: 48px; }
  .pj-chap__h { font-size: 26px; letter-spacing: -0.024em; }
  .pj-callout p { font-size: 26px; letter-spacing: -0.024em; }
  .pj-result { padding: 44px 48px 48px; }
  .pj-fig__n { font-size: 44px; letter-spacing: -0.032em; }
  .pj-navs { grid-template-columns: 1fr 1fr; }
  .pj-navs[data-single] { grid-template-columns: 1fr; }
  .pj-navc + .pj-navc { border-left: 1px solid var(--pj-rule); }
}

/* Le titre en colonne de gauche, collé pendant son chapitre. Sous cette
   largeur la colonne mangerait la mesure du texte. */
@media (min-width: 900px) {
  .pj-chap {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    gap: 0 40px;
  }
  .pj-chap__head { grid-column: 1; }
  .pj-chap__b { grid-column: 2; }
  .pj-chap__h { position: sticky; top: 78px; margin-bottom: 0; }
  .pj-result .pj-chap__h { position: static; }
}

@media (prefers-reduced-motion: reduce) {
  /* !important pour passer devant les durées que le geste écrit en style en
     ligne. Le tirage lui-même reste actif : suivre le doigt est de la
     manipulation directe, pas une animation. Seul le trajet de sortie, qui se
     joue tout seul, est supprimé. */
  .pj-sheet, .pj-scrim, main { transition-duration: 1ms !important; }
  .pj-visual__img { transition: filter 420ms linear; transform: none !important; }
  .pj-media[data-playing] .pj-visual__img { animation: none; }
  .pj-navc__a, .pj-close, .pj-btn { transition-property: background-color, color, opacity; }
}
</style>
</head>

<body>

         target="_blank" rel="noopener noreferrer"

        <!-- encre mesuree : 2.48 3.5 a 21.95 20.5 -->

          <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4v10.75H3V9.75Zm6.5 0h3.83v1.47h.05c.53-.95 1.84-1.95 3.78-1.95 4.04 0 4.79 2.5 4.79 5.76v5.47h-4v-4.85c0-1.16-.02-2.65-1.7-2.65-1.7 0-1.96 1.26-1.96 2.57v4.93h-4V9.75Z"/>
        </svg>

  </div>
</header>

<main>
  <section class="hero" id="accueil">
    <div class="hero__body">
      <div class="wrap">
        <div class="duo">
          <p class="label-metier rise">product manager</p>

<!-- ===========================================================================
     PAGE PROJET. La coquille seule : l'en-tête, la croix, et un conteneur que
     le script remplit. Hors de main, qui recule et se floute derrière elle.
     ======================================================================== -->
<div class="pj-scrim" id="pj-scrim" aria-hidden="true"></div>

<section class="pj-sheet" id="pj-sheet" role="dialog" aria-modal="true"
         aria-labelledby="pj-titre" inert>

          aria-label="Fermer et revenir aux projets">
