<script src="assets/dust.js"></script>

<script>
/* ==========================================================================
   Analytics. Deux evenements, points de declenchement identifiables.
   Plausible si present, sans cookie.
   ======================================================================= */
const MAIL = 'godefroy.mth@gmail.com';

function track(event) {
  if (typeof window.plausible === 'function') window.plausible(event);
}

const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Poser l'ancre sans jamais casser la page. Dans un contexte sans origine
   propre (iframe srcdoc de certaines previsualisations, document sandboxe),
   l'API History leve une SecurityError. L'ancre est du confort, pas une
   fonction : on l'abandonne en silence plutot que d'interrompre le script. */
function poserAncre(url) {
  try {
    history.replaceState(null, '', url);
  } catch (e) {
    /* Contexte sans origine propre. Rien a faire. */
  }
}

const onScroll = [];

/* La liste des projets. Hors des deux modules qui la lisent, la section
   Projets et la page projet : c'est la donnée de la page, pas celle d'un
   écran. */
const PROJETS = [/* projets-data */];

/* ==========================================================================
   Ancre Projets
   ======================================================================= */
(() => {
  const anchor = document.getElementById('anchor-projets');
  const slot = document.getElementById('anchor-slot');

  anchor.addEventListener('click', (e) => {
    e.preventDefault();
    track('clic_ancre_projets');
    document.getElementById('projets')
      .scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
    poserAncre('#projets');
  });

  /* L'ancre n'est plus affichee quand l'accueil a quitte l'ecran */
  new IntersectionObserver(([entry]) => {
    slot.toggleAttribute('data-gone', entry.intersectionRatio < 0.25);
  }, { threshold: [0, 0.25, 0.5] }).observe(document.getElementById('accueil'));

  /* Passage effectif dans Projets, une seule fois par session */
  let fired = false;
  new IntersectionObserver(([entry]) => {
    if (entry.isIntersecting && !fired) { fired = true; track('section_projets_atteinte'); }
  }, { threshold: 0.3 }).observe(document.getElementById('projets'));
})();

/* ==========================================================================
   Header, masque au defilement vers le bas, reapparait vers le haut
   ======================================================================= */
(() => {
  const header = document.getElementById('site-header');
  let last = window.scrollY;
  let ticking = false;

  function update() {
    const y = window.scrollY;
    if (y > 96 && y > last) header.setAttribute('data-hidden', '');
    else header.removeAttribute('data-hidden');
    last = y;
    ticking = false;
  }

  window.addEventListener('scroll', () => {
    onScroll.forEach((fn) => fn());
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
})();

/* ==========================================================================
   Bouton mail. Copie, puis pastille portant l'etat de la copie.

   Pas de minuteur : la pastille reste tant que l'utilisateur ne l'a pas
   congediee. Elle part au second clic sur l'enveloppe, au clic ailleurs,
   au defilement, ou a Echap.
   ======================================================================= */
(() => {
  const btn = document.getElementById('btn-mail');
  const toast = document.getElementById('toast');
  let open = false;

  const CTA = `
    <a class="toast__cta" href="mailto:${MAIL}">
      Écrire à Mathieu
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12h15"/><path d="m12.5 5.5 6.5 6.5-6.5 6.5"/>
      </svg>
    </a>`;

  function show(copied) {
    /* Meme forme dans les deux cas : l'adresse en haut, l'etat en dessous.
       Seuls le mot et la teinte de l'etat changent. Jade quand c'est en
       ordre, Ember quand le presse-papier a ete refuse : c'est l'idiome du
       systeme, une pastille de 7px puis le mot, ni puce ni badge. */
    toast.innerHTML = `
      <span class="toast__addr">${MAIL}</span>
      <div class="toast__row">
        <span class="toast__state toast__state--${copied ? 'ok' : 'fail'}">
          ${copied ? 'Adresse copiée' : 'Copie refusée'}
        </span>
        <span class="toast__sep" aria-hidden="true"></span>${CTA}
      </div>`;

    toast.setAttribute('data-open', '');
    btn.setAttribute('data-toast-open', '');
    open = true;
  }

  function close() {
    if (!open) return;
    toast.removeAttribute('data-open');
    btn.removeAttribute('data-toast-open');
    open = false;
  }

  btn.addEventListener('click', async (e) => {
    e.preventDefault();
    if (open) { close(); return; }            // second clic, on referme
    let copied = false;
    try { await navigator.clipboard.writeText(MAIL); copied = true; } catch { copied = false; }
    show(copied);
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  document.addEventListener('pointerdown', (e) => {
    if (!open) return;
    if (e.target.closest('#toast') || e.target.closest('#btn-mail')) return;
    close();
  });

  onScroll.push(close);
})();

/* ==========================================================================
   Parcours. Accordéon strict, et une sphère de poussière qui désigne la part
   de l'expérience survolée.

   DATES : hypothèse de travail. Les vraies dates de début et de fin ne sont
   pas encore connues, et tout le calcul des parts en dépend. Les remplacer
   ici suffit à tout recalculer.
   ======================================================================= */
(() => {
  const section = document.getElementById('parcours');
  if (!section) return;

  const PERIODES = {
    australie: ['2025-09-01', null],          /* en cours, court jusqu'à aujourd'hui */
    anyway:    ['2024-09-01', '2025-07-31'],
    havas:     ['2023-09-01', '2024-08-31']
  };

  const jour = (s) => s ? new Date(s + 'T00:00:00') : new Date();
  const mois = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + (b.getDate() >= a.getDate() ? 1 : 0);

  /* Les parts, en fractions exactes. Pas d'arrondi : la poussière n'a pas
     besoin qu'une part tombe sur un nombre entier de particules. */
  const ids = Object.keys(PERIODES).filter((id) => {
    const [a, b] = PERIODES[id];
    const ok = jour(b) > jour(a);
    if (!ok) console.warn('Expérience ignorée, dates invalides :', id);
    return ok;
  });
  const total = ids.reduce((acc, id) => acc + mois(jour(PERIODES[id][0]), jour(PERIODES[id][1])), 0);
  const PART = {};
  let curseur = 0;
  ids.forEach((id) => {
    const f = mois(jour(PERIODES[id][0]), jour(PERIODES[id][1])) / total;
    PART[id] = [curseur, curseur + f];
    curseur += f;
  });

  /* Le JS est là : on peut replier. Sans lui, tout reste déplié. */
  section.setAttribute('data-js', '');

  const canvas = document.getElementById('dust');
  const dust = (canvas && window.createDust)
    ? window.createDust(canvas, { mode: 'condense' })
    : { setState() {} };

  let ouverte = null, survolee = null;

  /* Le clic fait autorité sur le survol : tant qu'une fiche est ouverte, la
     poussière ne suit plus la souris, sinon on perdrait sa propre sélection
     en allant lire une autre ligne. */
  function poser() {
    if (ouverte) dust.setState({ range: PART[ouverte], phase: 'selected' });
    else if (survolee) dust.setState({ range: PART[survolee], phase: 'preview' });
    else dust.setState({ range: null, phase: 'rest' });
  }

  function peindre() {
    section.querySelectorAll('.xp').forEach((xp) => {
      const open = xp.dataset.id === ouverte;
      xp.toggleAttribute('data-open', open);
      xp.querySelector('.xp__head').setAttribute('aria-expanded', String(open));
    });
    poser();
    /* L'ancre est remplacée, jamais empilée : le bouton retour du navigateur
       ramène à la page précédente, pas à un état antérieur de l'accordéon. */
    poserAncre(ouverte ? '#' + ouverte : location.pathname + location.search);
  }

  section.querySelectorAll('.xp').forEach((xp) => {
    const head = xp.querySelector('.xp__head');
    const id = xp.dataset.id;

    head.addEventListener('click', () => {
      ouverte = ouverte === id ? null : id;
      if (ouverte) track('ouverture_experience');
      peindre();
    });
    head.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { survolee = id; poser(); } });
    head.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && survolee === id) { survolee = null; poser(); } });
    head.addEventListener('focus', () => { survolee = id; poser(); });
    head.addEventListener('blur', () => { if (survolee === id) { survolee = null; poser(); } });
  });

  /* Échap referme et rend le focus à l'en-tête qui vient d'être fermé. */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !ouverte) return;
    const head = section.querySelector('#xp-' + ouverte + ' .xp__head');
    ouverte = null;
    peindre();
    head && head.focus();
  });

  /* Clic ailleurs. La sphère n'est pas une zone de fermeture : elle n'ouvre,
     ne ferme et ne sélectionne rien. */
  document.addEventListener('pointerdown', (e) => {
    if (!ouverte) return;
    if (e.target.closest('.xp') || e.target.closest('.sphere')) return;
    ouverte = null;
    peindre();
  });

  /* Arrivée avec une ancre. Inconnue ou obsolète, on la retire sans message :
     l'écran est parfaitement utilisable dans son état par défaut. */
  /* Une ancre inconnue n'est pas retirée : elle appartient probablement à
     une autre section de la page. */
  const ancre = location.hash.slice(1);
  if (ancre && PART[ancre]) { ouverte = ancre; peindre(); }

  /* Le bandeau prend le fond de la section quand elle passe sous lui. */
  const header = document.getElementById('site-header');
  onScroll.push(() => {
    const r = section.getBoundingClientRect();
    const h = header.offsetHeight;
    header.toggleAttribute('data-ember', r.top <= h && r.bottom > h);
  });
})();

/* ==========================================================================
   Projets. Un seul projet net à la fois, les autres flous.

   La section n'a pas de défilement à elle : tout se calcule à partir de
   window.scrollY, et le calage sur un projet est confié au snap du document,
   en proximity. Voir le bloc PROJETS de la feuille de style.

   OUVERTURE D'UNE PAGE PROJET, non intégrée. Le prototype simulait la page
   dans le même document et faisait voyager le visuel en View Transitions.
   La vraie page projet est traitée par specs/04-page-projet.md et n'existe
   pas encore : plutôt que d'embarquer une page factice, le clic sur le
   projet net ne fait rien pour l'instant, et se contente d'être mesuré.
   Ce qui reste à rebrancher le jour venu : le gel du zoom lent avant la
   capture, le view-transition-name posé sur le visuel source puis rendu
   avant la capture du nouvel état, et le retour par le même chemin.

   CONTENU. Les projets vivent dans content/projets.json. Les cinq projets
   servis viennent du prototype et sont des données de travail, à remplacer
   par les vrais projets. Seul Audience Planning correspond à une expérience
   réelle.
   ======================================================================= */
(() => {
  const section = document.getElementById('projets');
  const list = document.getElementById('projets-list');
  if (!section || !list) return;

  /* Les valeurs lues ici sont écrites en dur dans la feuille de style, sans
     calc() : une propriété personnalisée n'est pas résolue à la lecture. */
  const cssVar = (n) => parseFloat(getComputedStyle(section).getPropertyValue(n));

  let rows = [];
  let inners = [];          /* .row__inner, porteurs du flou */
  let geom = [];            /* centre et hauteur de chaque ligne, en document */
  let applied = [];         /* dernière valeur écrite, pour ne pas réécrire */
  let netIndex = 0;
  let focusY = 0;           /* ordonnée de la ligne de focus, depuis le haut
                               de la fenêtre, plus une demi-ligne */
  let blurScale = 1;
  let bande = [0, 0];       /* plage de défilement où l'écran est à l'écran */

  /* Les lignes sont déjà dans le document, générées par build.mjs à partir de
     content/projets.json : cette fonction ne fait plus que les reprendre et
     les mesurer. */
  function build() {
    rows = [...list.querySelectorAll('.row')];
    inners = rows.map((r) => r.querySelector('.row__inner'));
    applied = rows.map(() => ({ blur: -1, fade: -1 }));
    loadVisuals();
    measure();
    paint(true);
  }

  /* Chargement progressif. Seuls le visuel net et le suivant partent tout de
     suite ; les autres attendent d'approcher du centre. Un visuel qui échoue
     garde son flou de chargement indéfiniment, la ligne reste cliquable. */
  function loadVisuals() {
    list.querySelectorAll('.visual[data-loading]').forEach((v, i) => {
      if (i > netIndex + 1) return;
      setTimeout(() => v.removeAttribute('data-loading'), 260 + i * 180);
    });
  }

  /* ==========================================================================
     LA LOI DU FLOU ET L'ÉLECTION DU PROJET NET

     Le flou dit lequel des cinq est le sujet. C'est une information de
     hiérarchie, donc il survit à prefers-reduced-motion : ce qui est coupé
     là-dessous, ce sont les déplacements, pas la lecture.

     Flouter cinq lignes plein écran est de loin l'opération la plus chère de
     la page. Quatre décisions pour qu'elle tienne le budget d'image :

     1. Rien n'est calculé quand l'écran n'est pas à l'écran. La page défile
        sur trois hauteurs de fenêtre, la section n'en occupe qu'une partie.
     2. Zéro lecture de géométrie pendant le défilement. La position de chaque
        ligne est mesurée une fois par construction et par redimensionnement.
        Un getBoundingClientRect par ligne et par image, entrelacé avec les
        écritures de style, forcerait cinq recalculs de mise en page
        synchrones par image.
     3. Le rayon de flou est échantillonné par paliers. Un flou coûte une
        rastérisation complète à chaque valeur distincte de rayon : en continu
        c'est soixante par seconde et par ligne, par paliers c'est douze au
        plus sur toute la course d'une ligne. L'opacité reste continue, elle :
        le compositeur la donne pour rien, et c'est elle qui porte la fluidité
        perçue du geste.
     4. Rien n'est écrit si la valeur n'a pas bougé. Les lignes hors champ
        sont au plafond et ne reçoivent plus aucune écriture.

     Aucun état intermédiaire ne reste figé à l'arrêt : settle() repeint en
     valeurs exactes, sans palier, 140ms après le dernier événement.

     La rampe est une puissance, pas une droite : elle monte lentement près du
     focus et n'accélère que loin de lui. Le projet suivant reste lisible,
     c'est seulement au-delà qu'il devient une masse, au moment où la ligne
     entre dans le halo et où les deux se confondent.
     d = 1 donne 1px, d = 1,5 donne 2px, le plafond de 3px tombe à d = 1,9.
     ======================================================================= */
  const RAMP_EXP   = 1.7;
  const BLUR_SLOPE = 1;      /* px de flou à une hauteur de ligne d'écart */
  const BLUR_MAX   = 3;
  const BLUR_STEP  = 0.25;
  /* L'opacité suit la même courbe et la même retenue : 8% de perte à une
     ligne d'écart, plancher à 30%. Avec un flou plafonné à 3px, une opacité
     qui tomberait plus bas redeviendrait le moyen principal, alors que
     l'information est portée par le flou. */
  const FADE_SLOPE = 0.08;
  const FADE_MAX   = 0.30;

  function measure() {
    if (!rows.length) return;
    /* Le projet net a son haut sur la ligne de focus, donc son centre une
       demi-ligne plus bas. Tout le reste en découle. */
    focusY = cssVar('--focus-top') + rows[0].offsetHeight / 2;
    /* Le flou se remesure ici, et pas une fois pour toutes : la bascule
       desktop vers mobile passe par une media query, pas par un rechargement. */
    blurScale = cssVar('--blur-scale') || 1;
    applied.forEach((a) => { a.blur = -1; a.fade = -1; });

    const y = window.scrollY;
    geom = rows.map((r) => {
      const b = r.getBoundingClientRect();
      return { c: b.top + y + b.height / 2, h: b.height || 1 };
    });
    /* La plage de défilement pendant laquelle une ligne au moins est visible,
       une hauteur de ligne de marge de part et d'autre. Hors de là, peindre
       ne servirait à rien. */
    bande = [
      geom[0].c - focusY - geom[0].h,
      geom[geom.length - 1].c - focusY + geom[0].h
    ];
  }

  let queued = false;
  function requestPaint() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => paint(false));
  }

  /* exact = true : valeurs continues, sans palier. Réservé à l'arrêt. */
  function paint(exact) {
    queued = false;
    if (!geom.length) return;

    const c = window.scrollY + focusY;
    let best = 0, bestD = Infinity;
    const ds = geom.map((g, i) => {
      const d = Math.abs(g.c - c) / g.h;
      if (d < bestD) { bestD = d; best = i; }
      return d;
    });

    for (let i = 0; i < rows.length; i++) {
      let blur, fade;
      if (rows[i].hasAttribute('data-claimed')) {
        /* La ligne revendiquée par un clic est nette avant d'être arrivée. */
        blur = 0; fade = 1;
      } else {
        const dp = Math.pow(ds[i], RAMP_EXP);
        const cap = BLUR_MAX * blurScale;
        const step = Math.max(0.125, BLUR_STEP * blurScale);
        const raw = Math.min(dp * BLUR_SLOPE * blurScale, cap);
        blur = exact ? raw : Math.min(Math.round(raw / step) * step, cap);
        fade = 1 - Math.min(dp * FADE_SLOPE, FADE_MAX);
      }
      const a = applied[i];
      if (blur !== a.blur) {
        /* none, et pas blur(0px) : none supprime la couche, 0px la garde. */
        inners[i].style.filter = blur > 0 ? `blur(${blur}px)` : 'none';
        a.blur = blur;
      }
      if (Math.abs(fade - a.fade) > 0.004) {
        inners[i].style.opacity = fade >= 0.999 ? '' : fade.toFixed(3);
        a.fade = fade;
      }
    }

    for (let i = 0; i < rows.length; i++) rows[i].toggleAttribute('data-net', i === best);
    if (best !== netIndex) { netIndex = best; loadVisuals(); }
  }

  /* ==========================================================================
     Défilement de la page.
     ======================================================================= */
  let lastScrollAt = 0;
  let endTimer;

  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    if (y < bande[0] || y > bande[1]) return;
    lastScrollAt = performance.now();
    requestPaint();
    clearTimeout(endTimer);
    endTimer = setTimeout(settle, 140);
  }, { passive: true });

  /* Aucun état intermédiaire ne doit rester figé quand le défilement
     s'arrête. Les revendications tombent avant le repeint, pas après : sinon
     une ligne revendiquée puis abandonnée en route resterait nette hors du
     centre jusqu'au défilement suivant.

     C'est aussi ici que le calage est garanti. Le snap du document est en
     proximity, faute de pouvoir être strict sans enfermer la page : il ne se
     déclenche qu'à l'approche d'un point de calage, et une impulsion qui
     s'arrête à mi-chemin laisse deux projets à demi nets côte à côte, ce qui
     est exactement ce que l'écran ne doit jamais montrer. Cent quarante
     millisecondes après le dernier événement, donc après le calage du
     navigateur s'il a eu lieu, on ramène sur le projet le plus proche.

     La garde est ce qui empêche ce rattrapage de devenir un piège : il
     n'agit qu'entre le premier et le dernier point de calage. En deçà on
     remonte vers l'accueil, au-delà on descend vers Parcours, et dans les
     deux cas la page doit être libre de partir. */
  const CALAGE_TOLERANCE = 2;      /* px, en deçà il n'y a rien à rattraper */

  function settle() {
    rows.forEach((r) => r.removeAttribute('data-claimed'));
    paint(true);

    if (tween || !geom.length) return;
    const y = window.scrollY;
    if (y <= targetTop(0) || y >= targetTop(geom.length - 1)) return;
    const to = targetTop(netIndex);
    if (Math.abs(y - to) > CALAGE_TOLERANCE) centerRow(netIndex, true);
  }

  let resizeQueued = false;
  window.addEventListener('resize', () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; measure(); paint(true); });
  });

  /* ==========================================================================
     LE CHROME DE L'ÉCRAN, fondu du haut et halo du bas.
     Ils arrivent quand l'accueil a entièrement quitté l'écran, exactement
     comme quand on clique l'ancre du hero, et repartent dès que Parcours
     entre : posés sur l'orange plein de Parcours, ils ne seraient plus que
     des salissures.
     ======================================================================= */
  (() => {
    const accueil = document.getElementById('accueil');
    const parcours = document.getElementById('parcours');
    if (!accueil || !parcours) { section.setAttribute('data-chrome', ''); return; }

    let accueilParti = false, parcoursEntre = false;
    const maj = () => section.toggleAttribute('data-chrome', accueilParti && !parcoursEntre);

    new IntersectionObserver(([e]) => { accueilParti = !e.isIntersecting; maj(); },
      { threshold: 0 }).observe(accueil);

    /* Parcours ne compte comme entré que lorsqu'il dépasse le haut du halo,
       et non dès son premier pixel : sur le dernier projet, le bas de la
       section tombe pile au bas de la fenêtre, et sans cette marge le halo
       disparaissait sur le projet où l'on a justement le plus besoin de
       savoir par où sortir. La marge est figée sur la valeur large ; sur
       téléphone le halo mesure 112px et part donc un peu plus tôt, ce qui ne
       se voit pas. */
    new IntersectionObserver(([e]) => { parcoursEntre = e.isIntersecting; maj(); },
      { threshold: 0, rootMargin: '0px 0px -141px 0px' }).observe(parcours);
  })();

  /* ==========================================================================
     RECENTRAGE.
     scrollIntoView({ behavior: 'smooth' }) est remplacé par un défilement
     piloté image par image. Trois raisons : sa durée appartient au navigateur
     et varie du simple au double selon la distance, sa courbe n'est pas la
     nôtre, et son interruption par un geste utilisateur n'est fiable sur
     aucun des trois moteurs. Ici la durée est connue, la courbe est celle du
     design system, et le premier geste rend la main immédiatement.

     C'est ce même défilement qui sert au calage après une impulsion libre,
     depuis settle() : la course est interruptible au premier geste, donc un
     rattrapage n'enferme jamais personne.
     ======================================================================= */

  /* Solveur de cubic-bezier, pour que le script suive exactement --ease-out
     plutôt qu'une approximation qui lui ressemblerait. */
  function bezier(x1, y1, x2, y2) {
    const A = (a, b) => 1 - 3 * b + 3 * a;
    const B = (a, b) => 3 * b - 6 * a;
    const C = (a) => 3 * a;
    const at = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
    const slope = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
    return (x) => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let k = 0; k < 6; k++) {
        const e = at(t, x1, x2) - x;
        const d = slope(t, x1, x2);
        if (Math.abs(e) < 1e-5 || d === 0) break;
        t -= e / d;
      }
      return at(t, y1, y2);
    };
  }
  const easeOut = bezier(0.23, 1, 0.32, 1);   /* --ease-out */

  let tween = 0;
  function stopTween() {
    if (!tween) return;
    cancelAnimationFrame(tween);
    tween = 0;
    paint(true);
  }
  ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach((t) =>
    window.addEventListener(t, stopTween, { passive: true }));

  function targetTop(i) {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    return Math.max(0, Math.min(geom[i].c - focusY, max));
  }

  function centerRow(i, animate) {
    stopTween();
    const to = targetTop(i);
    if (!animate || reduced()) { window.scrollTo(0, to); paint(true); return; }

    const from = window.scrollY;
    const dist = to - from;
    if (Math.abs(dist) < 1) { paint(true); return; }

    /* 240ms pour une ligne, 90ms par ligne supplémentaire, plafond 440ms.
       Au-delà on ne perçoit plus un rattrapage mais un transport. */
    const dur = Math.min(240 + Math.abs(dist) / geom[i].h * 90, 440);
    const t0 = performance.now();

    const step = (now) => {
      const t = Math.min((now - t0) / dur, 1);
      window.scrollTo(0, from + dist * easeOut(t));
      if (t < 1) { tween = requestAnimationFrame(step); return; }
      tween = 0;
      window.scrollTo(0, to);
      paint(true);
    };
    tween = requestAnimationFrame(step);
  }

  /* ==========================================================================
     Clic. Ligne floue : recentrage, avec retour visuel immédiat. Ligne nette :
     rien pour l'instant, voir l'entête de ce bloc. Le tap qui suit un
     défilement encore en cours est ignoré.
     ======================================================================= */
  function claim(row) {
    rows.forEach((r) => r.removeAttribute('data-claimed'));
    row.setAttribute('data-claimed', '');
    paint(true);                       /* la ligne devient nette tout de suite */
    centerRow(+row.dataset.index, true);
    /* Filet : si la ligne était déjà à sa place, aucun événement de
       défilement ne partira, donc settle() ne serait jamais appelé. */
    clearTimeout(endTimer);
    endTimer = setTimeout(settle, 600);
  }

  list.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    if (performance.now() - lastScrollAt < 120) return;   /* inhibition du tap */
    const i = +row.dataset.index;
    if (i === netIndex) {
      track('clic_projet_net');
      /* Les quatre autres projets sont des exemples en attente de contenu :
         leur ligne reste cliquable, elle n'ouvre simplement rien. */
      pageProjet.ouvrir(i, row);
      return;
    }
    claim(row);
  });

  /* Clavier. Tab amène le projet suivant au centre. */
  list.addEventListener('focusin', (e) => {
    const row = e.target.closest('.row');
    if (!row || +row.dataset.index === netIndex) return;
    claim(row);
  });

  /* ==========================================================================
     Sortie vers Parcours. Le halo est la sortie explicite ; à la fin de la
     liste le défilement continue de lui-même, il n'y a plus rien à franchir.
     ======================================================================= */
  const outro = document.getElementById('outro-parcours');
  if (outro) {
    outro.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('parcours')
        .scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
      poserAncre('#parcours');
    });
  }

  /* Les métriques changent quand la police variable arrive : on remesure. */
  document.fonts.ready.then(() => { measure(); paint(true); });
  build();

  /* US6, lien profond vers un projet. Une ancre morte ramène en tête de
     section, sans message. */
  const m = /^#projet-(\d+)$/.exec(location.hash);
  const i = m ? +m[1] - 1 : -1;
  if (i >= 0 && i < rows.length) centerRow(i, false);
})();

/* ==========================================================================
   PAGE PROJET, la carte superposée

   La carte se pose sur la page, elle ne la remplace pas. Le fond recule et
   s'assombrit, le voile monte, la feuille arrive. Tout ce qui est calé sur la
   feuille avance avec elle, image par image pendant le geste : attendre la
   fin du geste pour les jouer ferait deux évènements là où il n'y en a qu'un.

   Le contenu est injecté par build.mjs depuis content/page-projet.json, indexé
   sur la position dans content/projets.json. Un projet sans entrée n'ouvre
   rien : sa ligne reste cliquable dans la liste et le pied de carte de ses
   voisins l'ignore.
   ======================================================================= */
const pageProjet = (() => {
  const sheet = document.getElementById('pj-sheet');
  const scrim = document.getElementById('pj-scrim');
  const scroll = document.getElementById('pj-scroll');
  const btnClose = document.getElementById('pj-close');
  if (!sheet) return { ouvrir: () => false, aDuContenu: () => false };

  /* Le contenu, indexé sur la position dans PROJETS. Les longueurs sont
     celles de la spec : chapô 36 mots, contexte 56, enjeu 58, démarche 196,
     résultat 63. Un gabarit calé sur du texte court ment toujours. */
  /* Le contenu, indexé sur la position dans PROJETS. */
  const PROJETS_CONTENU = {/* page-projet-data */};
  const main = document.querySelector('main');
  const fond = [main, document.getElementById('site-header')].filter(Boolean);

  let courant = -1;
  let declencheur = null;

  const aDuContenu = (i) => Object.prototype.hasOwnProperty.call(PROJETS_CONTENU, i);

  /* ------------------------------------------------------------------------
     Rendu. Même visuel de substitution que la liste, mêmes trois couleurs :
     la vignette qu'on vient de cliquer et le média d'ouverture doivent être
     reconnaissables l'un dans l'autre.
     --------------------------------------------------------------------- */
  function visuel(p, id, cap) {
    return `
      <div class="pj-visual" data-loading>
        <svg class="pj-visual__img" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice"
             role="img" aria-label="${cap}">
          <defs>
            <linearGradient id="${id}" x1="0" y1="0" x2="0.4" y2="1">
              <stop offset="0%" stop-color="${p.a}"/>
              <stop offset="60%" stop-color="${p.b}"/>
              <stop offset="100%" stop-color="${p.c}"/>
            </linearGradient>
          </defs>
          <rect width="160" height="100" fill="url(#${id})"/>
          <path d="M0 100 L34 58 L58 78 L92 40 L118 66 L160 24 L160 100 Z"
                fill="${p.c}" opacity="0.22"/>
          <circle cx="122" cy="26" r="11" fill="${p.a}" opacity="0.7"/>
        </svg>
      </div>`;
  }

  /* Les sorties du chapitre Résultat. Le libellé du dépôt n'est pas saisi :
     un lien vers du code se nomme toujours pareil, autant le poser ici. La
     rangée n'existe pas quand aucun des deux liens n'est écrit. */
  function sorties(b) {
    const l = [];
    if (b.lien) {
      l.push(`<a class="pj-lien" href="${b.lien.url}"
         target="_blank" rel="noopener noreferrer">${b.lien.libelle}</a>`);
    }
    if (b.github) {
      l.push(`<a class="pj-lien pj-lien--code" href="${b.github}"
         target="_blank" rel="noopener noreferrer">
        <svg class="icon icon--github" viewBox="0 0 16 15.61" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>Le code sur GitHub</a>`);
    }
    return l.length ? `<div class="pj-sorties">${l.join('')}</div>` : '';
  }

  function chapitre(b) {
    const figs = b.figs ? `<ul class="pj-figs">${b.figs.map((f) =>
      `<li><span class="pj-fig__n">${f.n}</span><span class="pj-fig__l">${f.l}</span></li>`
    ).join('')}</ul>` : '';
    const callout = b.callout ? `
      <div class="pj-callout">
        <p>«&#8239;${b.callout}&#8239;»</p>
        <span class="pj-callout__perim"><b>Périmètre confié :</b> ${b.perim}</span>
      </div>` : '';
    return `
      <section class="pj-chap">
        <div class="pj-chap__head"><h2 class="pj-chap__h">${b.h}</h2></div>
        <div class="pj-chap__b">
          ${callout}
          ${figs}
          ${(b.p || []).map((t) => `<p>${t}</p>`).join('')}
          ${sorties(b)}
        </div>
      </section>`;
  }

  /* Les voisins, dans l'ordre de la liste : précédent égale plus récent. Un
     voisin dont le contenu n'est pas écrit n'est pas proposé. Quand il n'y a
     aucun voisin, la carte unique renvoie à la liste plutôt que de laisser un
     pied de carte vide. */
  function pied(i) {
    const prev = aDuContenu(i - 1) ? i - 1 : -1;
    const next = aDuContenu(i + 1) ? i + 1 : -1;
    const fleche = (droite) => `<svg class="pj-navc__a" width="14" height="14" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">${droite
          ? '<path d="M4 12h15"/><path d="m12.5 5.5 6.5 6.5-6.5 6.5"/>'
          : '<path d="M20 12H5"/><path d="m11.5 5.5-6.5 6.5 6.5 6.5"/>'}</svg>`;

    if (prev < 0 && next < 0) {
      return `<div class="pj-navs" data-single>
        <a class="pj-navc pj-navc--prev" href="#projets" data-nav="liste">
          <span class="pj-navc__k">${fleche(false)} Tous les projets</span>
          <span class="pj-navc__t">Revenir à la liste</span>
          <span class="pj-navc__y">${PROJETS.length} projets</span>
        </a></div>`;
    }
    const carte = (j, droite, mot) => {
      if (j < 0) return '';
      const p = PROJETS[j];
      return `<a class="pj-navc pj-navc--${droite ? 'next' : 'prev'}" href="#projet-${j + 1}" data-nav="${j}">
        <span class="pj-navc__k">${fleche(droite)} Projet ${mot}</span>
        <span class="pj-navc__t">${p.nom}</span>
        <span class="pj-navc__y">${p.date}</span></a>`;
    };
    return `<div class="pj-navs">${carte(prev, false, 'précédent')}${carte(next, true, 'suivant')}</div>`;
  }

  function rendre(i) {
    const p = PROJETS[i];
    const c = PROJETS_CONTENU[i];
    const corps = c.blocs.filter((b) => !b.result);
    const resultat = c.blocs.find((b) => b.result);

    scroll.innerHTML = `
      <div class="pj-topbar"><p class="pj-topbar__t">${p.nom}</p></div>

      <header class="pj-hero">
        <h1 class="pj-title" id="pj-titre">${p.nom}</h1>
        <p class="pj-chapo">${c.chapo}</p>
        <ul class="pj-meta"><li>${c.client}</li><li>${p.date}</li></ul>
        <svg class="pj-hint" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14"/><path d="m5.5 13 6.5 6.5 6.5-6.5"/>
        </svg>
      </header>

      <figure class="pj-media" id="pj-media">
        ${visuel(p, 'pj-g-media', c.media.cap)}
        <button class="pj-play" id="pj-play" type="button"
                aria-label="Lire la présentation du projet">
          <span class="pj-play__d">
            <svg class="pj-play__play" width="20" height="20" viewBox="0 0 24 24"
                 fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="pj-play__pause" width="18" height="18" viewBox="0 0 24 24"
                 fill="currentColor" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" rx="1"/>
              <rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          </span>
        </button>
        <figcaption class="pj-cap">${c.media.cap}</figcaption>
      </figure>

      <div class="pj-body">${corps.map(chapitre).join('')}</div>
      <div class="pj-result">${chapitre(resultat)}</div>

      <footer class="pj-foot">
        ${pied(i)}
        <div class="pj-contact">
          <p>Ce projet ressemble au vôtre ?</p>
          <a class="pj-btn" href="mailto:${MAIL}">Écrire à Mathieu
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12h15"/><path d="m12.5 5.5 6.5 6.5-6.5 6.5"/></svg>
          </a>
        </div>
      </footer>`;

    /* Le texte est déjà là, les visuels arrivent après : place réservée par
       le ratio, flou qui se lève, aucun saut de mise en page. */
    scroll.querySelectorAll('.pj-visual[data-loading]').forEach((v, k) => {
      setTimeout(() => v.removeAttribute('data-loading'), 300 + k * 420);
    });

    const media = document.getElementById('pj-media');
    const play = document.getElementById('pj-play');
    play.addEventListener('click', () => {
      const on = media.toggleAttribute('data-playing');
      play.setAttribute('aria-label', on ? 'Mettre en pause' : 'Lire la présentation du projet');
    });

    scroll.scrollTop = 0;
    scroll.removeAttribute('data-scrolled');
    scroll.removeAttribute('data-moved');
  }

  /* ------------------------------------------------------------------------
     Ouverture et fermeture. Le défilement de la page est gelé pendant la
     lecture : overflow sur la racine, qui garde la position au pixel, et la
     largeur de la barre de défilement rendue en marge pour que la page ne
     saute pas d'un cran vers la droite.
     --------------------------------------------------------------------- */
  function ouvrir(i, trigger) {
    if (!aDuContenu(i)) return false;
    if (courant !== i) { courant = i; rendre(i); }
    declencheur = trigger || null;

    /* Une réouverture immédiate ne doit pas hériter de la durée qu'un geste
       venait d'imposer à la sortie. */
    effacerStylesGeste();

    const barre = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.overflow = 'hidden';
    if (barre > 0) document.documentElement.style.paddingRight = barre + 'px';

    clearTimeout(sortie);
    document.body.removeAttribute('data-pj-sortie');
    document.body.setAttribute('data-projet', '');
    sheet.removeAttribute('inert');
    /* La page derrière sort de l'ordre de tabulation : sans cela, Tab sort de
       la carte par le bas et va lire une liste qu'on ne voit plus. */
    fond.forEach((n) => n.setAttribute('inert', ''));
    poserAncre('#projet-' + (i + 1));
    btnClose.focus({ preventScroll: true });
    track('ouvre_projet');
    return true;
  }

  /* Le temps que main revienne à l'échelle 1. Volontairement un cran au-delà
     des 300ms de la feuille, pour couvrir aussi la dernière image. */
  const SORTIE_FOND_MS = 340;
  let sortie = 0;

  function fermer() {
    if (!document.body.hasAttribute('data-projet')) return;
    document.body.removeAttribute('data-projet');
    document.body.setAttribute('data-pj-sortie', '');
    clearTimeout(sortie);
    sortie = setTimeout(() => document.body.removeAttribute('data-pj-sortie'), SORTIE_FOND_MS);
    sheet.setAttribute('inert', '');
    fond.forEach((n) => n.removeAttribute('inert'));
    document.documentElement.style.overflow = '';
    document.documentElement.style.paddingRight = '';
    poserAncre('#projets');
    if (declencheur && declencheur.isConnected) declencheur.focus({ preventScroll: true });
  }

  btnClose.addEventListener('click', () => fermer());
  scrim.addEventListener('click', () => fermer());
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.hasAttribute('data-projet')) fermer();
  });

  /* Le pied de carte. Passer au voisin ne change pas de page, il remplace le
     contenu de la carte : la page reste où elle est, derrière. */
  let verrou = false;
  scroll.addEventListener('click', (e) => {
    const c = e.target.closest('[data-nav]');
    if (!c) return;
    e.preventDefault();
    if (c.dataset.nav === 'liste') { fermer(); return; }
    if (verrou) return;
    verrou = true;
    setTimeout(() => {
      verrou = false;
      const j = +c.dataset.nav;
      courant = j;
      rendre(j);
      poserAncre('#projet-' + (j + 1));
    }, 180);
  });

  /* Filet de la barre interne, révélée dès que le titre part en haut. */
  scroll.addEventListener('scroll', () => {
    const fin = scroll.querySelector('.pj-hero .pj-meta');
    const seuil = fin ? fin.offsetTop + fin.offsetHeight - 62 : 220;
    scroll.toggleAttribute('data-scrolled', scroll.scrollTop > seuil);
    scroll.toggleAttribute('data-moved', scroll.scrollTop > 12);
  }, { passive: true });

  /* ========================================================================
     LE GESTE, téléphone seulement. Repousser la feuille vers le bas.

     Ce que le geste doit prouver : la carte est un objet posé sur la page. Un
     objet se pousse, il suit la main au pixel, il résiste quand on le force
     contre sa butée, et il garde la vitesse qu'on lui a donnée quand on le
     lâche. Le voile et le recul du fond avancent avec lui image par image.

     Pointer Events et non Touch : le même code sert la souris et le doigt.
     ===================================================================== */
  /* Les valeurs de l'état ouvert du fond, redites ici parce que le geste doit
     interpoler entre elles et l'état fermé sans relire le CSS. À garder
     synchronisées avec body[data-projet] main. */
  const FOND_SCALE = 0.94;
  const FOND_SHIFT = 12;
  const FOND_DIM = 0.94;

  /* Un quart de la hauteur. Plus bas, on fermerait en lisant ; plus haut, il
     faudrait traverser l'écran pour une action qu'on veut expédiée. */
  const RENVOI_RATIO = 0.25;
  /* Lâchée en mouvement, la feuille part sans avoir fait la distance.
     0,11 px/ms mesurés sur les 100 dernières millisecondes : la question
     n'est pas « le doigt a-t-il bougé » mais « partait-il encore ». */
  const VITESSE_RENVOI = 0.11;
  const RENVOI_MIN = 40;
  /* Résistance vers le haut. À 0,5 le premier pixel suit à moitié et le
     centième ne suit presque plus : la butée se sent avant de se heurter. Une
     butée franche, elle, se lit comme un bug. */
  const CAOUTCHOUC = 0.5;
  /* Le retour quand le geste est annulé. Court et en ease-out fort : un geste
     annulé ne se raconte pas, il s'efface. */
  const RETOUR_MS = 320;
  /* Bornes de la sortie. 300ms est la fermeture au clic : une poussée lente
     ne doit pas finir plus lentement qu'un clic. 160ms est le plancher sous
     lequel la sortie n'est plus un mouvement mais une disparition. */
  const SORTIE_MIN = 160;
  const SORTIE_MAX = 300;

  let pointeur = null;      /* pointeur suivi, verrou multi-touch */
  let tire = false;         /* le geste a pris la main */
  let depuisPoignee = false;
  let y0 = 0, x0 = 0, hauteur = 1, dernierY = 0;
  let mesures = [];
  let nettoyage = 0;
  let avalerClic = false;

  const borne = (v, a, b) => Math.max(a, Math.min(b, v));
  /* Formule de résistance d'Apple : linéaire au départ, asymptotique ensuite.
     La feuille ne se bloque jamais, elle devient lourde. */
  const caoutchouc = (x, dim) => (x * dim * CAOUTCHOUC) / (dim + CAOUTCHOUC * x);

  function mesurer(y, t) {
    mesures.push({ y, t });
    while (mesures.length > 2 && t - mesures[0].t > 100) mesures.shift();
  }
  function vitesse() {
    if (mesures.length < 2) return 0;
    const a = mesures[0], b = mesures[mesures.length - 1];
    return b.t > a.t ? (b.y - a.y) / (b.t - a.t) : 0;
  }

  /* Une seule fonction de rendu pour les trois éléments. Chaque transform est
     posé sur son élément : passer par une propriété personnalisée sur un
     parent recalculerait le style de tout le contenu à chaque image. */
  function image(y) {
    dernierY = y;
    const p = borne(y / hauteur, 0, 1);
    sheet.style.transform = `translateY(${y}px)`;
    scrim.style.opacity = String(1 - p);
    main.style.transform =
      `scale(${FOND_SCALE + (1 - FOND_SCALE) * p}) translateY(${FOND_SHIFT * (1 - p)}px)`;
    main.style.filter = `brightness(${FOND_DIM + (1 - FOND_DIM) * p})`;
  }

  /* Rend la main au CSS : on efface les valeurs du geste et on impose la
     durée du trajet restant, que l'état d'arrivée soit l'ouvert ou le fermé.
     La transition repart de la position atteinte au doigt, donc le geste
     reste interruptible et réversible jusqu'au dernier moment. */
  function relacher(ms, easing) {
    sheet.style.transition = `transform ${ms}ms ${easing}`;
    main.style.transition = `transform ${ms}ms ${easing}, filter ${ms}ms ${easing}`;
    scrim.style.transition = `opacity ${ms}ms var(--ease-out)`;
    sheet.style.transform = '';
    main.style.transform = '';
    main.style.filter = '';
    scrim.style.opacity = '';
    clearTimeout(nettoyage);
    nettoyage = setTimeout(effacerStylesGeste, ms + 60);
  }

  /* Au repos, les durées et les états appartiennent au CSS, pas au script. */
  function effacerStylesGeste() {
    clearTimeout(nettoyage);
    sheet.style.transition = '';
    main.style.transition = '';
    scrim.style.transition = '';
    sheet.style.transform = '';
    main.style.transform = '';
    main.style.filter = '';
    scrim.style.opacity = '';
  }

  function arreter() {
    if (pointeur !== null && sheet.hasPointerCapture(pointeur)) sheet.releasePointerCapture(pointeur);
    pointeur = null;
    tire = false;
    document.body.removeAttribute('data-pj-drag');
  }

  sheet.addEventListener('pointerdown', (e) => {
    if (window.innerWidth > 860) return;           /* la fenêtre centrée ne se tire pas */
    if (!document.body.hasAttribute('data-projet')) return;
    if (pointeur !== null) return;                 /* un doigt de plus ferait sauter la feuille */
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('button, a')) return;     /* la croix et le pied restent des cibles */
    avalerClic = false;
    pointeur = e.pointerId;
    y0 = e.clientY;
    x0 = e.clientX;
    depuisPoignee = !e.target.closest('.pj-scroll') || !!e.target.closest('.pj-grab, .pj-topbar');
    mesures = [];
    mesurer(e.clientY, e.timeStamp);
  });

  addEventListener('pointermove', (e) => {
    if (e.pointerId !== pointeur) return;
    const dy = e.clientY - y0;
    const dx = e.clientX - x0;
    mesurer(e.clientY, e.timeStamp);

    if (!tire) {
      /* 4px de marge : sous ce seuil c'est un clic qui tremble, et on ne vole
         pas un clic. */
      if (Math.abs(dy) < 4 && Math.abs(dx) < 4) return;
      if (Math.abs(dx) > Math.abs(dy)) { arreter(); return; }
      /* L'arbitrage avec le défilement. Contenu défilé : le doigt lit.
         Contenu en haut et doigt qui descend : il n'y a plus rien à remonter,
         le geste passe à la feuille. */
      if (!depuisPoignee && !(scroll.scrollTop <= 0 && dy > 0)) { arreter(); return; }

      tire = true;
      document.body.setAttribute('data-pj-drag', '');
      sheet.setPointerCapture(pointeur);   /* le geste continue hors de la feuille */
      hauteur = sheet.getBoundingClientRect().height;
      sheet.style.transition = 'none';
      main.style.transition = 'none';
      scrim.style.transition = 'none';
      clearTimeout(nettoyage);
    }

    e.preventDefault();
    image(dy > 0 ? dy : -caoutchouc(-dy, hauteur));
  }, { passive: false });

  addEventListener('pointerup', (e) => {
    if (e.pointerId !== pointeur) return;
    if (!tire) { arreter(); return; }
    const v = vitesse();
    const y = dernierY;
    const lance = v > VITESSE_RENVOI && y > RENVOI_MIN;
    arreter();
    avalerClic = true;

    if (y > hauteur * RENVOI_RATIO || lance) {
      /* La vitesse du geste continue dans la sortie : au coup sec elle est
         courte, à la poussée lente elle retombe sur la durée du clic. La
         feuille ne repart jamais de zéro après avoir été lancée. */
      const reste = Math.max(hauteur - y, 0);
      const ms = borne(v > 0 ? reste / v : SORTIE_MAX, SORTIE_MIN, SORTIE_MAX);
      fermer();
      relacher(ms, 'var(--pj-ease-drawer)');
    } else {
      relacher(RETOUR_MS, 'var(--ease-out)');
    }
  });

  /* Annulation système, le navigateur reprend le pointeur : la feuille
     revient, elle ne reste pas à mi-chemin. */
  addEventListener('pointercancel', (e) => {
    if (e.pointerId !== pointeur) return;
    const etait = tire;
    arreter();
    if (etait) relacher(RETOUR_MS, 'var(--ease-out)');
  });

  /* Un geste qui se termine sur un lien ne doit pas le suivre. Le clic arrive
     après le pointerup, donc le drapeau survit au geste juste le temps de
     l'avaler. */
  sheet.addEventListener('click', (e) => {
    if (!avalerClic) return;
    avalerClic = false;
    e.preventDefault();
    e.stopPropagation();
  }, true);

  /* US6, lien profond vers un projet. Ce module est déclaré après celui de la
     section Projets, qui a donc déjà calé la liste sur le bon projet quand on
     arrive ici : la page est en place avant qu'on gèle son défilement. Une
     ancre qui ne désigne aucun projet écrit ne fait rien, la liste reste la
     page. */
  const ancre = /^#projet-(\d+)$/.exec(location.hash);
  if (ancre) ouvrir(+ancre[1] - 1, null);

  return { ouvrir, aDuContenu };
})();
</script>
</body>
</html>
