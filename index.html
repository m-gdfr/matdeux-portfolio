<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathieu Godefroy, product manager</title>
<meta name="description" content="Comprendre les utilisateurs pour leur apporter des solutions qui ont du sens.">
<link rel="preload" href="assets/fonts/GeneralSans-Variable.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ---------------------------------------------------------------------------
   General Sans, coupe variable obligatoire : les paliers 470 et 550
   n'existent pas en statique et retomberaient tous les deux sur 500.
   ------------------------------------------------------------------------ */
@font-face {
  font-family: 'General Sans';
  src: url('assets/fonts/GeneralSans-Variable.woff2') format('woff2-variations'),
       url('assets/fonts/GeneralSans-Variable.woff')  format('woff-variations');
  font-weight: 200 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --color-parchment-canvas: #fffaeb;
  --color-papier: #fffdf6;
  --color-suie: #171613;
  --color-jade: #0b6b5a;
  --color-ember: #fa520f;
  --color-ember-ink: #c04408;

  /* muted mesure 4.9:1 sur le parchemin, au dessus du plancher 4.5:1 */
  --color-muted: rgba(23, 22, 19, 0.62);
  --color-hairline: rgba(23, 22, 19, 0.12);
  --color-border: rgba(23, 22, 19, 0.13);
  --color-wash: rgba(23, 22, 19, 0.06);

  --font-general: 'General Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --weight-title: 600;
  --weight-lede: 550;
  --weight-body: 470;

  --page-max-width: 1200px;
  --gutter: 48px;

  --shadow-xl:
    rgba(127, 99, 21, 0.12) -8px 16px 39px 0px,
    rgba(127, 99, 21, 0.1) -33px 64px 72px 0px,
    rgba(127, 99, 21, 0.06) -73px 144px 97px 0px,
    rgba(127, 99, 21, 0.02) -130px 256px 115px 0px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

@media (max-width: 720px) { :root { --gutter: 20px; } }

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--color-parchment-canvas);
  color: var(--color-suie);
  font-family: var(--font-general);
  font-weight: var(--weight-body);
  font-size: 17px;
  line-height: 1.68;
  letter-spacing: -0.008em;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--color-ember);
  outline-offset: 3px;
  border-radius: 3px;
}

.wrap {
  width: 100%;
  max-width: var(--page-max-width);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ===========================================================================
   HEADER, composant global, present sur toutes les sections.

   Contraste des graisses : le nom est le seul 550 du header, les liens
   descendent en 470. Un seul 600 dans tout le premier ecran, le manifeste.
   ======================================================================== */
.site-header {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 100;
  background: var(--color-parchment-canvas);
  transform: translateY(0);
  transition: transform 220ms var(--ease-out);
}
.site-header[data-hidden] { transform: translateY(-100%); }

.site-header__inner {
  display: flex;
  align-items: center;
  gap: 24px;
  height: 72px;
}

.site-name {
  font-size: 17px;
  font-weight: var(--weight-lede);
  letter-spacing: -0.014em;
  white-space: nowrap;      /* le nom garde la priorite, jamais comprime */
  margin-right: auto;
}

/* Une seule rangee de cibles de 32px. Le retrait negatif ramene le dernier
   glyphe sur la marge de page : c'est l'icone qui s'aligne avec le nom,
   pas sa boite de survol. */
.header-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
  margin-right: -7px;
}

.link-github {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 32px;
  padding: 0 7px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: var(--weight-body);
  letter-spacing: -0.006em;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 150ms ease;
}
.link-github__word {
  text-decoration: 1.5px solid underline transparent;
  text-underline-offset: 4px;
  transition: text-decoration-color 150ms ease;
}
.link-github:hover .link-github__word,
.link-github:focus-visible .link-github__word {
  text-decoration-color: var(--color-ember);
}

.pill-icon {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 150ms ease;
}
.pill-icon:hover,
.link-github:hover { background: var(--color-wash); }
.pill-icon:active { background: rgba(23, 22, 19, 0.1); }
.pill-icon[data-toast-open] { background: var(--color-wash); }

/* Chaque viewBox est recadre sur l'encre du glyphe, donc la boite SVG est
   exactement le dessin. Centrer les boites aligne les encres, hauts comme
   bas, ce qu'un viewBox geometrique ne faisait pas : la masse du sigle
   LinkedIn tombe sous son centre geometrique et le faisait pendre. */
.icon { display: block; overflow: visible; }
/* Tailles calculees a partir des bornes d'encre mesurees (getBBox), pour que
   les trois encres fassent 13px de haut et partagent la meme ligne de pied.
   GitHub monte a 14px : un disque plein lit plus petit qu'un trace a hauteur
   egale. Le trace du mail est etendu de 0.85 par sa demi epaisseur de trait,
   d'ou la marge du viewBox, sans quoi le bord droit se faisait rogner. */
.icon--github   { width: 14.35px; height: 14px; }
.icon--mail     { width: 17.1px;  height: 13.35px; }
.icon--linkedin { width: 14.89px; height: 13px; }

/* Sur mobile, GitHub repasse en pastille de meme gabarit */
@media (max-width: 720px) {
  .link-github { width: 32px; padding: 0; }
  .link-github__word { display: none; }
  .site-header__inner { height: 64px; }
}

/* ---- Pastille de copie ------------------------------------------------- */
.mail-wrap { position: relative; }

.toast {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 10;
  width: max-content;
  max-width: min(340px, calc(100vw - 2 * var(--gutter)));
  padding: 8px 10px 8px 12px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: var(--color-papier);
  box-shadow: var(--shadow-xl);

  /* Entree et sortie par le meme chemin, en transition et non en keyframes :
     un second clic retargette depuis la valeur courante au lieu de repartir
     de zero. L'origine est posee sur la gachette. */
  transform-origin: top right;
  opacity: 0;
  transform: translateY(-5px) scale(0.97);
  transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
  pointer-events: none;
}
.toast[data-open] {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.toast__row {
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}

/* L'etat de copie suit l'idiome du systeme : une pastille de 7px puis le
   mot, dans la meme teinte. Ni puce coloree, ni badge. */
.toast__state {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: var(--weight-lede);
  line-height: 1.3;
  letter-spacing: -0.006em;
}
.toast__state::before {
  content: '';
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 999px;
  background: currentColor;
}
.toast__state--ok   { color: var(--color-jade); }
.toast__state--fail { color: var(--color-ember-ink); }
.toast__state--fail::before { background: var(--color-ember); }

.toast__sep { width: 1px; height: 16px; flex: none; background: var(--color-hairline); }

/* L'adresse est toujours affichee, en haut et selectionnable a la main.
   Que la copie ait reussi ou non, le contact n'est jamais perdu, et la
   pastille ne change pas de forme entre les deux etats : seul l'etat, en
   dessous, change de mot et de teinte. */
.toast__addr {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: var(--weight-lede);
  line-height: 1.4;
  letter-spacing: -0.006em;
  color: var(--color-suie);
  user-select: all;
  -webkit-user-select: all;
}

/* Bouton fantome : pas de pave noir dans une pastille de 36px de haut */
.toast__cta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
  padding: 4px 6px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: var(--weight-lede);
  letter-spacing: -0.006em;
  text-decoration: none;
  transition: background-color 150ms ease;
}
.toast__cta:hover { background: var(--color-wash); }
.toast__cta svg { color: var(--color-ember); }

/* ===========================================================================
   ACCUEIL
   ======================================================================== */
.hero {
  position: relative;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}
/* Sous 600px de hauteur utile, hauteur automatique plutot qu'un manifeste
   ecrase. L'ancre peut alors sortir du premier ecran. */
@media (max-height: 600px) {
  .hero { min-height: auto; padding-block: 112px 64px; }
}

.hero__body {
  flex: 1;
  display: flex;
  align-items: center;
}

/* Label et manifeste forment une seule boite en max-content, centree sur la
   page, le label cale sur le centre vertical du manifeste. */
.duo {
  display: flex;
  align-items: center;
  gap: 96px;
  width: max-content;
  max-width: 100%;
  margin-inline: auto;
}

.manifeste {
  margin: 0;
  /* Coupes ecrites en dur : le texte etant fige, l'absence de mot orphelin
     est deterministe au lieu d'etre confiee au navigateur. Et max-content
     fait coller la boite a l'encre, sans quoi centrer la boite ne centre
     pas ce que l'oeil voit. */
  width: max-content;
  max-width: 100%;
  font-size: 34px;
  line-height: 1.26;
  letter-spacing: -0.03em;
  font-weight: var(--weight-title);   /* le seul 600 du premier ecran */
}
.manifeste__cursor {
  display: inline-block;
  width: 0.08em;
  height: 0.92em;
  margin-left: 0.12em;
  vertical-align: -0.08em;
  background: var(--color-ember);     /* Ember en aplat, jamais en texte */
  /* Purement decoratif : ni clignotement, ni animation de saisie. */
}
.vignette {
  display: inline-block;
  vertical-align: -0.2em;
  margin-left: 0.24em;
  width: 1.05em;
  height: 1.05em;
  border-radius: 999px;
}

.label-metier {
  margin: 0;
  color: var(--color-muted);
  font-size: 17px;
  line-height: 1.4;
  font-weight: var(--weight-body);
  white-space: nowrap;
}

/* ---- Ancre Projets ---------------------------------------------------- */
.anchor-slot {
  padding-bottom: 56px;
  transition: opacity 200ms var(--ease-out);
}
.anchor-slot__wrap { display: flex; justify-content: center; }
.anchor-slot[data-gone] { opacity: 0; pointer-events: none; }

.anchor {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
  font-size: 17px;
  font-weight: var(--weight-lede);
  letter-spacing: -0.014em;
  text-decoration: none;
}
.anchor__word {
  text-decoration: 1.5px solid underline transparent;
  text-underline-offset: 5px;
  transition: text-decoration-color 150ms ease;
}
.anchor:hover .anchor__word,
.anchor:focus-visible .anchor__word { text-decoration-color: var(--color-ember); }
.anchor__arrow {
  display: block;
  color: var(--color-ember);
  transition: transform 160ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  .anchor:hover .anchor__arrow { transform: translateY(3px); }
}
.anchor:focus-visible .anchor__arrow { transform: translateY(3px); }

/* ---- Apparition au chargement -----------------------------------------
   Une animation CSS, pas une transition pilotee en JS : elle tourne hors du
   thread principal pendant que la page charge, et elle joue meme si le
   JavaScript est desactive. Sans elle, un .rise a opacity 0 laisserait un
   ecran vide.
   ---------------------------------------------------------------------- */
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.rise { animation: rise 520ms var(--ease-out) both; }
.rise--2 { animation-delay: 70ms; }
.rise--3 { animation-delay: 140ms; }

/* ===========================================================================
   MOBILE, empilement, ordre label puis manifeste puis ancre
   ======================================================================== */
@media (max-width: 720px) {
  .duo { display: block; width: auto; margin-inline: 0; }

  .label-metier {
    display: inline-flex;
    align-items: center;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.2;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: var(--weight-lede);
  }

  /* "Comprendre les utilisateurs" mesure 13.9 fois le corps dans cette
     coupe. Le plafond calcule garantit que la plus longue des trois lignes
     tient dans la largeur utile, sans jamais couper un mot. */
  .manifeste {
    width: auto;
    font-size: min(28px, calc((100vw - 40px) / 13.9));
    line-height: 1.24;
  }

  .anchor-slot { padding-bottom: 40px; }
  .anchor-slot__wrap { justify-content: flex-start; }
  /* Le retrait annule le rembourrage du lien : c'est l'encre de "Projets"
     qui s'aligne sur la gouttiere, comme le nom et le manifeste. */
  .anchor { margin-left: -4px; }
}

/* ===========================================================================
   PROJETS, gabarit d'ancrage. Contenu traite par specs/02-projets.md.
   ======================================================================== */
.projets {
  min-height: 100svh;
  padding-block: 96px;
  border-top: 1px solid var(--color-hairline);
}
.projets__label {
  margin: 0 0 20px;
  font-size: 13px;
  font-weight: var(--weight-lede);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--color-muted);
}
.projets__title {
  margin: 0;
  font-size: 44px;
  line-height: 1.1;
  letter-spacing: -0.032em;
  font-weight: var(--weight-title);
}

/* ===========================================================================
   REDUCED MOTION, etat statique equivalent. Aucune information, aucune
   action n'est perdue par rapport a la version animee.
   ======================================================================== */
@media (prefers-reduced-motion: reduce) {
  .rise { animation: none; opacity: 1; transform: none; }
  .site-header,
  .anchor-slot,
  .anchor__arrow,
  .toast { transition-duration: 1ms !important; }
  .toast { transform: none !important; }
  .anchor:hover .anchor__arrow,
  .anchor:focus-visible .anchor__arrow { transform: none; }
}
</style>
</head>

<body>

<header class="site-header" id="site-header">
  <div class="site-header__inner wrap">
    <span class="site-name">Mathieu Godefroy</span>

    <nav class="header-actions" aria-label="Liens de contact">
      <!-- GitHub en toutes lettres : c'est celui qu'on veut faire cliquer -->
      <a class="link-github"
         href="https://github.com/m-gdfr"

        <svg class="icon icon--github" viewBox="0 0 16 15.61" fill="currentColor" aria-hidden="true">

</header>

<main>

          <h1 class="manifeste rise rise--2">Comprendre les utilisateurs<br>pour leur apporter des<br>solutions qui ont du sens.<span class="manifeste__cursor" aria-hidden="true"></span><svg class="vignette" viewBox="0 0 32 32" role="img" aria-label="Vignette illustrée, silhouette de montagnes au crépuscule"><clipPath id="vg-clip"><circle cx="16" cy="16" r="16"/></clipPath><linearGradient id="vg-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff0c2"/><stop offset="55%" stop-color="#fa520f"/><stop offset="100%" stop-color="#c04408"/></linearGradient><g clip-path="url(#vg-clip)"><rect width="32" height="32" fill="url(#vg-sky)"/><circle cx="21" cy="12" r="4" fill="#fff0c2"/><path d="M0 32 L9 17 L15 25 L22 13 L32 32 Z" fill="#171613"/></g></svg></h1>

<script>
/* ==========================================================================
   Analytics. Deux evenements, points de declenchement identifiables.
   Plausible si present, sans cookie.
   ======================================================================= */
const MAIL = 'godefroy.mth@gmail.com';

function track(event) {
  if (typeof window.plausible === 'function') window.plausible(event);
}

const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const onScroll = [];

/* ==========================================================================
   Ancre Projets
   ======================================================================= */
(() => {
  const anchor = document.getElementById('anchor-projets');
  const slot = document.getElementById('anchor-slot');

  anchor.addEventListener('click', (e) => {
    e.preventDefault();
    track('clic_ancre_projets');
    document.getElementById('projets')
      .scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
    history.replaceState(null, '', '#projets');
  });

  /* L'ancre n'est plus affichee quand l'accueil a quitte l'ecran */
  new IntersectionObserver(([entry]) => {
    slot.toggleAttribute('data-gone', entry.intersectionRatio < 0.25);
  }, { threshold: [0, 0.25, 0.5] }).observe(document.getElementById('accueil'));

  /* Passage effectif dans Projets, une seule fois par session */
  let fired = false;
  new IntersectionObserver(([entry]) => {
    if (entry.isIntersecting && !fired) { fired = true; track('section_projets_atteinte'); }
  }, { threshold: 0.3 }).observe(document.getElementById('projets'));
})();

/* ==========================================================================
   Header, masque au defilement vers le bas, reapparait vers le haut
   ======================================================================= */
(() => {
  const header = document.getElementById('site-header');
  let last = window.scrollY;
  let ticking = false;

  function update() {
    const y = window.scrollY;
    if (y > 96 && y > last) header.setAttribute('data-hidden', '');
    else header.removeAttribute('data-hidden');
    last = y;
    ticking = false;
  }

  window.addEventListener('scroll', () => {
    onScroll.forEach((fn) => fn());
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
})();

/* ==========================================================================
   Bouton mail. Copie, puis pastille portant l'etat de la copie.

   Pas de minuteur : la pastille reste tant que l'utilisateur ne l'a pas
   congediee. Elle part au second clic sur l'enveloppe, au clic ailleurs,
   au defilement, ou a Echap.
   ======================================================================= */
(() => {
  const btn = document.getElementById('btn-mail');
  const toast = document.getElementById('toast');
  let open = false;

  const CTA = `
    <a class="toast__cta" href="mailto:${MAIL}">
      Écrire à Mathieu
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12h15"/><path d="m12.5 5.5 6.5 6.5-6.5 6.5"/>
      </svg>
    </a>`;

  function show(copied) {
    /* Meme forme dans les deux cas : l'adresse en haut, l'etat en dessous.
       Seuls le mot et la teinte de l'etat changent. Jade quand c'est en
       ordre, Ember quand le presse-papier a ete refuse : c'est l'idiome du
       systeme, une pastille de 7px puis le mot, ni puce ni badge. */
    toast.innerHTML = `
      <span class="toast__addr">${MAIL}</span>
      <div class="toast__row">
        <span class="toast__state toast__state--${copied ? 'ok' : 'fail'}">
          ${copied ? 'Adresse copiée' : 'Copie refusée'}
        </span>
        <span class="toast__sep" aria-hidden="true"></span>${CTA}
      </div>`;

    toast.setAttribute('data-open', '');
    btn.setAttribute('data-toast-open', '');
    open = true;
  }

  function close() {
    if (!open) return;
    toast.removeAttribute('data-open');
    btn.removeAttribute('data-toast-open');
    open = false;
  }

  btn.addEventListener('click', async (e) => {
    e.preventDefault();
    if (open) { close(); return; }            // second clic, on referme
    let copied = false;
    try { await navigator.clipboard.writeText(MAIL); copied = true; } catch { copied = false; }
    show(copied);
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  document.addEventListener('pointerdown', (e) => {
    if (!open) return;
    if (e.target.closest('#toast') || e.target.closest('#btn-mail')) return;
    close();
  });

  onScroll.push(close);
})();
</script>
</body>
</html>
